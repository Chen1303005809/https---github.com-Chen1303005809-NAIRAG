<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RAG 数据上传 v5</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], input[type="file"], select, textarea { width: 100%; padding: 8px; margin-bottom: 10px; }
        .section { margin-bottom: 30px; border: 1px solid #eee; padding: 15px; border-radius: 6px; background-color: #fafafa; }
        .file-list { margin-top: 10px; }
        .file-item { margin: 5px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #results { margin-top: 20px; }
        .preview-container {
            border: 1px dashed #ccc;
            padding: 10px;
            margin-top: 10px;
            min-height: 50px;
            background-color: #fcfcfc;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            margin-right: 10px;
            vertical-align: middle;
            border: 1px solid #eee;
            cursor: pointer;
        }
        .remove-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 2px 6px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 12px;
        }
        .remove-btn:hover { background-color: #cc0000; }
        .result-container {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            overflow: auto;
        }
        .result-image {
            max-width: 400px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #preview-images, #doc-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        #preview-images > div, #doc-preview-list > div {
            display: flex;
            align-items: center;
            border: 1px solid #eee;
            padding: 5px;
            border-radius: 4px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            margin: 10% auto;
            display: block;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            object-fit: contain;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #bbb;
        }
        .docx-upload-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px dashed #4CAF50;
            border-radius: 6px;
            background-color: #f0fff0;
        }
        h4 {
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
        }
        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px dashed #ccc;
        }
        .admin-btn {
            margin-left: 10px;
            padding: 4px 8px;
            font-size: 12px;
            background-color: #2196F3;
        }
        #login-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
        /* 登出按钮样式 */
        #logout-btn {
            margin-left: 10px;
            padding: 5px 10px;
            background-color: #ff9800;
        }
        #logout-btn:hover {
            background-color: #e68a00;
        }
    </style>
</head>
<body>
    <h1>📌 RAG 数据上传 v5（支持5库 + 文档 + 四段式回复 + 权限管理）</h1>
    <span id="rejectedAlert" style="display:none; position:fixed; top:20px; right:20px; background:red; color:white; width:30px; height:30px; border-radius:50%; text-align:center; line-height:30px; cursor:pointer; font-weight:bold; z-index:10000;" title="您有被拒数据">!</span>
    
    <!-- 🔐 登录区域 -->
    <div id="login-section">
        <h3>🔒 用户登录</h3>
        <input type="text" id="username" placeholder="用户名" />
        <input type="password" id="password" placeholder="密码" />
        <button type="button" onclick="login()">登录</button>
        <span id="login-status" style="margin-left: 10px;"></span>
    </div>

    <!-- ✅ 主表单区域（默认隐藏） -->
    <div id="main-form" style="display: none;">
        <!-- 添加用户信息显示区域 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px; background-color: #f8f9fa; border-radius: 6px;">
            <div>
                <span style="font-weight: bold; color: #333;">当前用户：</span>
                <span id="current-user-display" style="color: #1976d2;"></span>
                <span id="current-user-role" style="color: #666; margin-left: 10px;"></span>
            </div>
            <button id="logout-btn" style="padding: 6px 12px; background-color: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="logout()">
                登出
            </button>
        </div>
        
        <h2>结构化数据录入（单条）</h2>
        <form id="queryFrom" enctype="multipart/form-data">
            <div class="form-group">
                <label>选择目标数据库（可多选）</label><br>
                <input type="checkbox" name="selected_dbs" value="rag_bge_m3_structured_v4_1"> 融航期货交易平台<br>
                <input type="checkbox" name="selected_dbs" value="rag_bge_m3_structured_v4_2"> 融航AMS资管平台<br>
                <input type="checkbox" name="selected_dbs" value="rag_bge_m3_structured_v4_3"> 融航HMS资产管理平台<br>
                <input type="checkbox" name="selected_dbs" value="rag_bge_m3_structured_v4_4"> 核算模块<br>
                <input type="checkbox" name="selected_dbs" value="rag_bge_m3_structured_v4_5"> 随心易终端<br>
                <input type="checkbox" name="selected_dbs" value="TEST"> 多模态混合测试<br>
            </div>

            <div class="form-group">
                <h3>📝 数据记录</h3>
                <div id="single-record-form" class="section">
                    <div class="form-group">
                        <label for="type">问题类型</label>
                        <select name="type" id="type" required>
                            <option value="">--请选择--</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="object">具体功能&相关模块</label>
                        <select name="object" id="object" required>
                            <option value="">--请选择--</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="purpose">应用场景</label>
                        <select name="purpose" id="purpose" required>
                            <option value="">--请选择--</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="customer_type">客户类型</label>
                        <select name="customer_type" id="customer_type" required>
                            <option value="">--请选择--</option>
                        </select>
                    </div>

                    <!-- ✅ 四段式回复内容 -->
                    <div class="form-group">
                        <label>回复逻辑框架（必填）</label>
                        <textarea name="reply_logic" id="reply_logic" rows="3" placeholder="如：首先确认用户权限，然后检查配置..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>说明功能（必填）</label>
                        <textarea name="feature_explanation" id="feature_explanation" rows="3" placeholder="如：该功能用于计算账户净头寸..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>举例说明/视频链接（选填）</label>
                        <textarea name="example" id="example" rows="2" placeholder="如：用户A在XX场景下..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>注意事项（选填）</label>
                        <textarea name="notes" id="notes" rows="2" placeholder="如：仅支持机构客户使用..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>关键词（逗号分隔）</label>
                        <input type="text" name="keyword" id="keyword" placeholder="如：净头寸,计算,公式" />
                    </div>
                    <div class="form-group">
                        <label>类似问法（每行一个问题）</label>
                        <textarea name="problem" id="problem" rows="3" placeholder="什么是净头寸？&#10;如何计算净头寸？"></textarea>
                    </div>
                </div>
            </div>

            <!-- 图片上传 -->
            <div class="form-group">
                <label for="files">🖼️ 图片上传（支持拖拽或粘贴截图）</label>
                <input type="file" id="files" name="files" multiple accept="image/*" onchange="handleImageUpload(event)">
                <div id="preview-container" class="preview-container" ondrop="handleImageDrop(event)" ondragover="allowDrop(event)">
                    <p>拖放图片或粘贴截图</p>
                    <div id="preview-images" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px;"></div>
                </div>
            </div>

            <!-- 文档上传 -->
            <div class="form-group">
                <label for="docFiles">📄 文档上传（.docx / .pdf / .zip，支持拖拽或上传）</label>
                <input type="file" id="docFiles" name="docFiles" multiple accept=".docx,.pdf,.zip" onchange="handleDocUpload(event)">
                <div id="doc-preview-container" class="preview-container" ondrop="handleDocDrop(event)" ondragover="allowDrop(event)">
                    <p>拖放文档或上传文档</p>
                    <div id="doc-preview-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
                </div>
            </div>

            <button type="submit">📤 上传数据</button>
        </form>
    </div>

    <!-- 大图预览模态框 -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img id="modalImage" class="modal-content">
    </div>

    <script>
        let currentUser = null;
        let authToken = localStorage.getItem('authToken') || null;
        let authUsername = localStorage.getItem('authUsername') || null;

        // 页面加载时尝试自动登录
        document.addEventListener('DOMContentLoaded', function() {
            // 如果有存储的token和用户名，尝试自动登录
            if (authToken && authUsername) {
                currentUser = {
                    name: authUsername,
                    token: authToken,
                    role: localStorage.getItem('authRole') || 'user'
                };
                
                // 验证token是否有效
                fetch('/options', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                })
                .then(res => {
                    if (res.ok) {
                        // Token有效，显示主表单
                        document.getElementById('main-form').style.display = 'block';
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('login-status').textContent = `✅ 已登录 (${currentUser.role})`;
                        
                        // 更新用户信息显示
                        document.getElementById('current-user-display').textContent = currentUser.name;
                        document.getElementById('current-user-role').textContent = `(${currentUser.role})`;
                        
                        // 加载选项和检查被拒数据
                        loadOptions();
                        checkRejectedRecords();
                        setInterval(checkRejectedRecords, 30000);
                    } else {
                        // Token无效，清除本地存储
                        clearAuthStorage();
                        currentUser = null;
                    }
                })
                .catch(() => {
                    // 请求失败，清除本地存储
                    clearAuthStorage();
                    currentUser = null;
                });
            }
        });

        // 清除认证存储的函数
        function clearAuthStorage() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('authUsername');
            localStorage.removeItem('authRole');
            authToken = null;
            authUsername = null;
        }
        // 防止拖拽默认行为
        function allowDrop(event) {
            event.preventDefault();
        }

        // 修改后的图片上传处理函数
        function handleImageUpload(event) {
            const newFiles = event.target.files;
            if (newFiles.length === 0) return;
            
            // 获取当前input元素
            const input = document.getElementById('files');
            
            // 创建DataTransfer对象来合并文件
            const dt = new DataTransfer();
            
            // 先添加已有的文件
            Array.from(input.files).forEach(file => {
                dt.items.add(file);
            });
            
            // 再添加新文件
            Array.from(newFiles).forEach(file => {
                // 检查是否重复
                const isDuplicate = Array.from(input.files).some(existingFile => 
                    existingFile.name === file.name && 
                    existingFile.size === file.size && 
                    existingFile.lastModified === file.lastModified
                );
                
                if (!isDuplicate) {
                    dt.items.add(file);
                }
            });
            
            // 更新input的文件列表
            input.files = dt.files;
            
            // 更新预览
            updateFilePreview('files', 'preview-images', [], 'image');
        }

        // 修改后的文档上传处理函数
        function handleDocUpload(event) {
            const newFiles = event.target.files;
            if (newFiles.length === 0) return;
            
            // 获取当前input元素
            const input = document.getElementById('docFiles');
            
            // 创建DataTransfer对象来合并文件
            const dt = new DataTransfer();
            
            // 先添加已有的文件
            Array.from(input.files).forEach(file => {
                dt.items.add(file);
            });
            
            // 再添加新文件
            Array.from(newFiles).forEach(file => {
                // 检查是否重复
                const isDuplicate = Array.from(input.files).some(existingFile => 
                    existingFile.name === file.name && 
                    existingFile.size === file.size && 
                    existingFile.lastModified === file.lastModified
                );
                
                if (!isDuplicate) {
                    dt.items.add(file);
                }
            });
            
            // 更新input的文件列表
            input.files = dt.files;
            
            // 更新预览
            updateFilePreview('docFiles', 'doc-preview-list', [], 'doc');
        }

        // 修改后的预览更新函数
        function updateFilePreview(inputId, previewListId, newFiles, type) {
            const input = document.getElementById(inputId);
            const previewList = document.getElementById(previewListId);
            
            // 清空预览区
            previewList.innerHTML = '';
            
            // 如果没有文件，显示提示文字
            if (input.files.length === 0) {
                const placeholder = document.createElement('p');
                placeholder.textContent = type === 'image' ? '拖放图片或粘贴截图' : '拖放文档或上传文档';
                previewList.parentElement.insertBefore(placeholder, previewList);
                placeholder.style.display = 'block';
                return;
            }
            
            // 隐藏提示文字
            const placeholder = previewList.parentElement.querySelector('p');
            if (placeholder) {
                placeholder.style.display = 'none';
            }
            
            // 为每个文件创建预览
            Array.from(input.files).forEach(file => {
                const wrapper = document.createElement('div');
                wrapper.style.cssText = type === 'image' 
                    ? 'position:relative; display:inline-block; margin:8px;'
                    : 'display:flex; align-items:center; gap:12px; padding:12px; background:#f8fff8; border:1px solid #d0e8d0; border-radius:8px; margin:8px 0;';
                
                if (type === 'image') {
                    const reader = new FileReader();
                    reader.onload = e => {
                        wrapper.innerHTML = `
                            <img src="${e.target.result}" style="width:130px; height:130px; object-fit:cover; border-radius:8px;">
                            <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:white; padding:4px; font-size:12px; text-align:center; border-radius:0 0 8px 8px;">
                                ${file.name}
                            </div>
                        `;
                        addDeleteButton(wrapper, file, inputId, previewListId, type);
                    };
                    reader.readAsDataURL(file);
                } else {
                    wrapper.innerHTML = `
                        <span style="font-size:36px;">📄</span>
                        <span style="flex:1; font-weight:500;">${file.name}</span>
                    `;
                    addDeleteButton(wrapper, file, inputId, previewListId, type);
                }
                
                previewList.appendChild(wrapper);
            });
        }

        // 美化版删除按钮（替换原来的 addDeleteButton 函数）
        function addDeleteButton(wrapper, fileToDelete, inputId, previewListId, type) {
            const delBtn = document.createElement('button');
            delBtn.textContent = '×';
            delBtn.type = 'button';
            
            // 统一的现代美观样式
            delBtn.style.cssText = `
                position: absolute;
                top: 8px;
                right: 8px;
                width: 28px;
                height: 28px;
                border: none;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.8);
                color: #999;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 6px rgba(0,0,0,0.15);
                transition: all 0.2s ease;
                z-index: 10;
                backdrop-filter: blur(4px);
            `;

            // 文档类型时位置调整（原来是 static）
            if (type === 'doc') {
                delBtn.style.position = 'static';
                delBtn.style.marginLeft = 'auto';
            }

            // 悬停效果：背景变浅红，文字变红，略微放大
            delBtn.onmouseover = () => {
                delBtn.style.background = 'rgba(255, 77, 77, 0.9)';
                delBtn.style.color = 'white';
                delBtn.style.transform = 'scale(1.1)';
                delBtn.style.boxShadow = '0 4px 12px rgba(255,77,77,0.3)';
            };

            delBtn.onmouseout = () => {
                delBtn.style.background = 'rgba(255, 255, 255, 0.8)';
                delBtn.style.color = '#999';
                delBtn.style.transform = 'scale(1)';
                delBtn.style.boxShadow = '0 2px 6px rgba(0,0,0,0.15)';
            };

            // 点击删除逻辑（保持原功能）
            delBtn.onclick = () => {
                const input = document.getElementById(inputId);
                const dt = new DataTransfer();
                
                Array.from(input.files).forEach(file => {
                    if (file !== fileToDelete) {
                        dt.items.add(file);
                    }
                });
                
                input.files = dt.files;

                // 重新更新预览
                if (inputId.startsWith('edit-new')) {
                    // 编辑弹窗中的新增文件
                    if (type === 'image') {
                        updateEditImagePreview();
                    } else {
                        updateEditDocPreview();
                    }
                } else {
                    // 主页面上传
                    updateFilePreview(inputId, previewListId, [], type);
                }
            };

            wrapper.appendChild(delBtn);
        }
        // ============ 图片拖放 ============
        function handleImageDrop(event) {
            event.preventDefault();
            const newFiles = event.dataTransfer.files;
            if (newFiles.length === 0) return;
            
            // 获取当前input元素
            const input = document.getElementById('files');
            
            // 创建DataTransfer对象来合并文件
            const dt = new DataTransfer();
            
            // 先添加已有的文件
            Array.from(input.files).forEach(file => {
                dt.items.add(file);
            });
            
            // 再添加新文件
            Array.from(newFiles).forEach(file => {
                // 检查是否是图片
                if (!file.type.startsWith('image/')) return;
                
                // 检查是否重复
                const isDuplicate = Array.from(input.files).some(existingFile => 
                    existingFile.name === file.name && 
                    existingFile.size === file.size && 
                    existingFile.lastModified === file.lastModified
                );
                
                if (!isDuplicate) {
                    dt.items.add(file);
                }
            });
            
            // 更新input的文件列表
            input.files = dt.files;
            
            // 更新预览
            updateFilePreview('files', 'preview-images', [], 'image');
        }

        // ============ 文档拖放 ============
        function handleDocDrop(event) {
            event.preventDefault();
            const newFiles = event.dataTransfer.files;
            if (newFiles.length === 0) return;
            
            // 获取当前input元素
            const input = document.getElementById('docFiles');
            
            // 创建DataTransfer对象来合并文件
            const dt = new DataTransfer();
            
            // 先添加已有的文件
            Array.from(input.files).forEach(file => {
                dt.items.add(file);
            });
            
            // 再添加新文件
            Array.from(newFiles).forEach(file => {
                // 检查是否是支持的文档类型
                const ext = file.name.toLowerCase();
                if (!['.pdf', '.docx', '.doc', '.zip'].some(e => ext.endsWith(e))) return;
                
                // 检查是否重复
                const isDuplicate = Array.from(input.files).some(existingFile => 
                    existingFile.name === file.name && 
                    existingFile.size === file.size && 
                    existingFile.lastModified === file.lastModified
                );
                
                if (!isDuplicate) {
                    dt.items.add(file);
                }
            });
            
            // 更新input的文件列表
            input.files = dt.files;
            
            // 更新预览
            updateFilePreview('docFiles', 'doc-preview-list', [], 'doc');
        }

        // 页面加载时确保提示文字显示
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.preview-container p').forEach(p => p.style.display = 'block');
        });

        // 关闭大图模态框（你已有）
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('imageModal').style.display = 'none';
        });
        window.onclick = event => {
            if (event.target === document.getElementById('imageModal')) {
                document.getElementById('imageModal').style.display = 'none';
            }
        };
        // ========== 登录 ==========
        async function login() {
            const user = document.getElementById('username').value;
            const pwd = document.getElementById('password').value;
            if (!user || !pwd) {
                alert('请输入用户名和密码');
                return;
            }
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, password: pwd})
                });
                const data = await res.json();
                if (res.ok) {
                    // 保存认证信息到本地存储
                    authToken = data.access_token;
                    authUsername = user;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('authUsername', authUsername);
                    localStorage.setItem('authRole', data.role);
                    
                    currentUser = {name: user, role: data.role, token: data.access_token};
                    document.getElementById('login-status').textContent = `✅ 已登录 (${data.role})`;
                    
                    // 更新用户信息显示
                    document.getElementById('current-user-display').textContent = user;
                    document.getElementById('current-user-role').textContent = `(${data.role})`;
                    
                    // 登录成功后显示主表单，隐藏登录区
                    document.getElementById('main-form').style.display = 'block';

                populateSelect('purpose', opts.purpose);
                populateSelect('customer_type', opts.customer_type);

        function populateSelect(id, items) {

                opt.value = item;
                opt.textContent = item;
                sel.appendChild(opt);

                    btn.onclick = () => openOptionEditor(cat, opts[cat]);
                    const label = document.querySelector(`label[for="${cat}"]`);

                        label.parentNode.insertBefore(btn, label.nextSibling);

            // 保存按钮点击事件
            saveBtn.onclick = function() {
                const newItemsStr = textarea.value;
                const items = newItemsStr.split('\n')

                    .filter(x => x);
                    
                if (items.length === 0) {
                    alert('至少保留一个选项');
                    return;
                }
                
                // 发送更新请求
                fetch(`/options/${category}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentUser.token}`

                    document.body.removeChild(modal);

                if (e.target === modal) {

                }
            });

            document.addEventListener('keydown', function escHandler(e) {

                    document.body.removeChild(modal);
                    document.removeEventListener('keydown', escHandler);
                }

            textarea.focus();
            textarea.select();
        }

        // ========== 粘贴截图支持 ==========
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('preview-container');
            const inputElement = document.getElementById('files');
            const previewImages = document.getElementById('preview-images');

            container.addEventListener('paste', function(event) {
                const clipboardData = event.clipboardData || window.clipboardData;
                if (!clipboardData) return;

                const items = clipboardData.items;
                if (!items) return;

                let imageFile = null;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') === 0) {
                        imageFile = items[i].getAsFile();
                        break;
                    }
                }

                if (!imageFile) return;

                const fingerprint = `${imageFile.name}-${imageFile.size}-${imageFile.lastModified}`;
                const existingFiles = Array.from(inputElement.files || []);
                const seenFiles = new Map();

                existingFiles.forEach(f => {
                    const fp = `${f.name}-${f.size}-${f.lastModified}`;
                    seenFiles.set(fp, f);
                });

                if (seenFiles.has(fingerprint)) {
                    console.log("粘贴的图片已被添加，跳过");
                    return;
                }

                const dt = new DataTransfer();
                existingFiles.forEach(f => dt.items.add(f));
                dt.items.add(imageFile);
                inputElement.files = dt.files;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const placeholder = document.querySelector('#preview-container > p');
                    if (placeholder && previewImages.children.length === 0) {
                        placeholder.remove();
                    }

                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-image';
                    img.title = imageFile.name;
                    img.onclick = function() {
                        const modal = document.getElementById('imageModal');
                        const modalImg = document.getElementById('modalImage');
                        modalImg.src = e.target.result;
                        modal.style.display = 'block';
                    };

                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'X';
                    removeBtn.className = 'remove-btn';
                    removeBtn.onclick = function() {
                        const newDt = new DataTransfer();
                        const currentFiles = Array.from(inputElement.files);
                        currentFiles.forEach(f => {
                            const fp = `${f.name}-${f.size}-${f.lastModified}`;
                            if (fp !== fingerprint) {
                                newDt.items.add(f);
                            }
                        });
                        inputElement.files = newDt.files;
                        const container = img.parentElement;
                        if (container) container.remove();

                        if (previewImages.children.length === 0) {
                            const containerDiv = document.getElementById('preview-container');
                            if (!containerDiv.querySelector('p')) {
                                const p = document.createElement('p');
                                p.textContent = '拖放图片或粘贴截图';
                                containerDiv.insertBefore(p, previewImages);
                            }
                        }
                    };

                    const container = document.createElement('div');
                    container.style.display = 'flex';
                    container.style.alignItems = 'center';
                    container.appendChild(img);
                    container.appendChild(removeBtn);
                    previewImages.appendChild(container);
                };
                reader.readAsDataURL(imageFile);
            });
        });

                }

                const record = {
                    type,
                    object,
                    purpose,
                    customer_type: customerType,
                    reply_logic: replyLogic,
                    feature_explanation: featureExplanation,
                    example,
                    notes,
                    keyword: keyword || '',
                    problem
                };

                let imageUrlList = ["N/A"];
                let fileUrlList = ["N/A"];

                // 上传图片
                const filesInput = document.getElementById('files');
                const imageFiles = filesInput.files;
                if (imageFiles.length > 0) {
                    const imageFormData = new FormData();
                    Array.from(imageFiles).forEach(file => imageFormData.append('files', file));
                    const imageResponse = await fetch('/upload_images', {
                        method: 'POST',
                        body: imageFormData
                    });
                    const imageResult = await imageResponse.json();
                    if (!imageResponse.ok) throw new Error(imageResult.detail || '图片上传失败');
                    imageUrlList = imageResult.image_paths;
                }

                // 上传文档
                const docInput = document.getElementById('docFiles');
                const docFiles = docInput.files;
                if (docFiles.length > 0) {
                    const docFormData = new FormData();
                    Array.from(docFiles).forEach(file => docFormData.append('files', file));
                    const docResponse = await fetch('/upload_documents', {
                        method: 'POST',
                        body: docFormData
                    });
                    const docResult = await docResponse.json();
                    if (!docResponse.ok) throw new Error(docResult.detail || '文档上传失败');
                    fileUrlList = docResult.document_paths;
                }

                record.image_url = imageUrlList;
                record.file_url = fileUrlList;

                formData.append('records_json', JSON.stringify([record]));
                const dbs = document.querySelectorAll('input[name="selected_dbs"]:checked');
                dbs.forEach(db => formData.append('selected_dbs', db.value));

                // 附加文件（虽冗余，但保留以兼容后端）

                Array.from(docFiles).forEach(f => formData.append('doc_files', f));

                // 发送请求时强制包含认证头
                const response = await fetch('/upload_json', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentUser.token}`
                    },
                    body: formData
                });

                // 处理401未授权错误
                if (response.status === 401) {
                    alert('登录已过期，请重新登录');
                    logout();
                    return;
                }

                const result = await response.json();
                if (response.ok) {
                    alert(`🎉 成功提交审核，等待管理员处理`);
                    // 重置表单
                    document.getElementById('queryFrom').reset();
                    document.getElementById('preview-images').innerHTML = '';
                    document.getElementById('doc-preview-list').innerHTML = '';
                } else {
                    throw new Error(result.detail || '上传失败');

            } catch (error) {
                console.error("Submit error:", error);
                alert(`❌ 错误: ${error.message}`);
            }
        });

        // 编辑弹窗 - 新增图片拖放
        function handleEditImageDrop(event) {
            event.preventDefault();
            const dt = event.dataTransfer;
            if (dt.files.length > 0) {
                const input = document.getElementById('edit-new-images-input');
                const newDt = new DataTransfer();
                Array.from(input.files).forEach(f => newDt.items.add(f));
                Array.from(dt.files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const duplicate = Array.from(input.files).some(f => 
                            f.name === file.name && f.size === file.size && f.lastModified === file.lastModified
                        );
                        if (!duplicate) newDt.items.add(file);
                    }
                });
                input.files = newDt.files;
                updateEditImagePreview();
            }
        }

        // 编辑弹窗 - 新增文档拖放
        function handleEditDocDrop(event) {
            event.preventDefault();
            const dt = event.dataTransfer;
            if (dt.files.length > 0) {
                const input = document.getElementById('edit-new-docs-input');
                const newDt = new DataTransfer();
                Array.from(input.files).forEach(f => newDt.items.add(f));
                Array.from(dt.files).forEach(file => {
                    const ext = file.name.toLowerCase();
                    if (['.pdf', '.docx', '.zip'].some(e => ext.endsWith(e))) {
                        const duplicate = Array.from(input.files).some(f => 
                            f.name === file.name && f.size === file.size && f.lastModified === file.lastModified
                        );
                        if (!duplicate) newDt.items.add(file);
                    }
                });
                input.files = newDt.files;
                updateEditDocPreview();
            }
        }

            const input = document.getElementById('edit-new-images-input');

            if (input.files.length === 0) {
                preview.parentElement.querySelector('p').style.display = 'block';

            preview.parentElement.querySelector('p').style.display = 'none';

        async function reSubmitRejectedFull(uploader, oldId, selectedDbs) {
            if (!confirm("确认修改并重新上传？这将清除原被拒记录")) return;

            const formData = new FormData();
            // ============ 【关键兜底】必须至少选一个数据库 ============
            const selectedCheckboxes = document.querySelectorAll('#tempEditModal .edit-db-checkbox:checked');
            if (selectedCheckboxes.length === 0) {
                alert('请至少选择一个目标数据库！');
                return;
            }
            // 收集用户最新选择的数据库
            selectedCheckboxes.forEach(cb => {
                formData.append('selected_dbs', cb.value);
            });

            // 基本信息
            formData.append('old_record_id', oldId);
            formData.append('uploader', uploader);
            

            // 四段式内容
            const recordData = {
                type: document.getElementById('edit_type').value,
                object: document.getElementById('edit_object').value,
                purpose: document.getElementById('edit_purpose').value,
                customer_type: document.getElementById('edit_customer_type').value,
                reply_logic: document.getElementById('edit_reply_logic').value.trim(),
                feature_explanation: document.getElementById('edit_feature_explanation').value.trim(),
                example: document.getElementById('edit_example').value.trim(),
                notes: document.getElementById('edit_notes').value.trim(),
                keyword: document.getElementById('edit_keyword').value,
                problem: document.getElementById('edit_problem').value.split('\n').map(s => s.trim()).filter(s => s)
            };
            formData.append('record_data', JSON.stringify(recordData));

            // 保留的旧图片URL
            document.querySelectorAll('#current-images input[type="checkbox"]:checked').forEach(cb => {
                formData.append('keep_image_urls', cb.dataset.url);
            });

            // 保留的旧文档URL
            document.querySelectorAll('#current-docs input[type="checkbox"]:checked').forEach(cb => {
                formData.append('keep_file_urls', cb.dataset.url);
            });

            // 新增图片（支持拖拽、粘贴、多选）
            const newImagesInput = document.getElementById('edit-new-images-input');
            if (newImagesInput && newImagesInput.files) {
                Array.from(newImagesInput.files).forEach(file => {
                    formData.append('new_images', file);
                });
            }

            // 新增文档
            const newDocsInput = document.getElementById('edit-new-docs-input');
            if (newDocsInput && newDocsInput.files) {
                Array.from(newDocsInput.files).forEach(file => {
                    formData.append('new_docs', file);
                });
            }

            try {
                const res = await fetch('/resubmit_rejected', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                const result = await res.json();
                if (res.ok) {
                    alert('修改成功！已重新提交审核');
                    document.getElementById('tempEditModal').remove();
                    checkRejectedRecords();  // 刷新红点
                } else {
                    alert('提交失败：' + (result.detail || result.message));
                }
            } catch (err) {
                alert('网络错误：' + err.message);
            }
        }
