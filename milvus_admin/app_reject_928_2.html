<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Milvus 数据管理后台（增强版）</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .table-responsive {
            margin-top: 20px;
        }
        #dataTable {
            width: 100%;
            border-collapse: collapse;
        }
        #dataTable th,
        #dataTable td {
            padding: 10px;
            vertical-align: top;
            word-break: break-word;
            line-height: 1.4;
        }
        #dataTable th {
            background-color: #f8f9fa;
            font-weight: bold;
            text-align: left;
        }
        #dataTable th:last-child,
        #dataTable td:last-child {
            width: 1%;
            white-space: nowrap;
            text-align: right;
        }
        .modal { display: none; position: fixed; z-index: 1050; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-dialog { margin: 10% auto; max-width: 700px; }
        .modal-content { background-color: #fefefe; padding: 20px; border: 1px solid #888; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        #previewImage { max-width: 100%; }
        #totalInfo { margin-top: 10px; }
        .filter-section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .file-item { 
            border: 1px solid #ddd; 
            padding: 8px; 
            margin: 4px 0; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
        }
        .file-item input[type="checkbox"] { margin-right: 8px; }
        .file-item label { flex: 1; }
        .file-item a, .file-item button {
            margin-left: 8px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Milvus 数据管理后台（增强版）</h2>
        <div class="mb-3 d-flex justify-content-between align-items-center">
            <div>
                <label for="collectionSelect" class="form-label">选择数据库：</label>
                <select id="collectionSelect" class="form-select w-25">
                    <option value="">-- 请选择 --</option>
                    <option value="rag_bge_m3_structured_v4_1">融航期货交易平台</option>
                    <option value="rag_bge_m3_structured_v4_2">融航AMS资管平台</option>
                    <option value="rag_bge_m3_structured_v4_3">融航HMS资产管理平台</option>
                    <option value="rag_bge_m3_structured_v4_4">核算模块</option>
                    <option value="rag_bge_m3_structured_v4_5">随心易终端</option>
                    <option value="TEST">多模态混合检索测试</option>
                </select>
                <div class="mt-2">
                    <button class="btn btn-primary" onclick="loadData(currentCollection)">🔄 刷新</button>
                    <button class="btn btn-danger" onclick="batchDelete()">🗑️ 批量删除选中</button>
                    <button class="btn btn-info" onclick="showLogs()">查看操作日志</button>
                    <!-- 增加被拒数据选项卡 -->
                    <button class="btn btn-warning ms-2" onclick="loadRejectedManagement()" style="font-weight:bold;">
                        被拒数据管理
                    </button>
                    <button class="btn btn-success ms-2" onclick="window.open('/user_management.html','_blank')">
                        用户管理
                    </button>
                    <button class="btn btn-danger ms-2" onclick="if(confirm('确定清除所有被拒数据？')) clearAllRejected()" id="clearAllBtn" style="display:none;">
                        全部清除
                    </button>
                </div>
            </div>
            <div>
                <span id="currentUserDisplay" class="me-3"></span>
                <button class="btn btn-outline-secondary" onclick="logout()">登出</button>
            </div>
        </div>

        <!-- 筛选和搜索区域 -->
        <div class="filter-section">
            <div class="row g-2 mb-3">
                <div class="col-md-3">
                    <label class="form-label">具体功能&相关模块</label>
                    <select class="form-select" id="filterObject" onchange="applyFilters()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">问题类型</label>
                    <select class="form-select" id="filterType" onchange="applyFilters()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">应用场景</label>
                    <select class="form-select" id="filterPurpose" onchange="applyFilters()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">客户类型</label>
                    <select class="form-select" id="filterCustomerType" onchange="applyFilters()">
                        <option value="">全部</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label for="searchInput" class="form-label">🔍 搜索关键词 / 类似问题 / 回复内容</label>
                <input type="text" class="form-control" id="searchInput" placeholder="输入关键词搜索..." oninput="applyFilters()">
            </div>
        </div>

        <div class="table-responsive">
            <table id="dataTable" class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>
                            <span class="ms-1">全选</span>
                            <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                        </th>
                        <th>ID</th>
                        <th>具体功能&相关模块</th>
                        <th>问题类型</th>
                        <th>应用场景</th>
                        <th>客户类型</th>
                        <th>关键词</th>
                        <th>类似问题</th>
                        <th>回复内容</th>
                        <th>更新时间</th>
                        <th>图片</th>
                        <th>文档</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="11">正在加载数据...</td></tr>
                </tbody>
            </table>
            <div id="totalInfo">总计: 0 条</div>
        </div>

        <!-- 编辑模态框（升级版：支持下拉 + 可手动输入） -->
        <div id="editModal" class="modal">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">编辑记录</h5>
                        <span class="close" onclick="closeModal('editModal')">&times;</span>
                    </div>
                    <div class="modal-body">
                        <!-- ======== 新增：目标数据库选择（审核端编辑时可用）======== -->
                        <div class="mb-4 p-3 border-start border-primary border-4 bg-light">
                            <label class="form-label fw-bold text-primary">目标数据库（可多选）</label>
                            <div class="row">
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input edit-db-checkbox" type="checkbox" value="rag_bge_m3_structured_v4_1" id="db1_edit">
                                        <label class="form-check-label" for="db1_edit">融航期货交易平台</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input edit-db-checkbox" type="checkbox" value="rag_bge_m3_structured_v4_2" id="db2_edit">
                                        <label class="form-check-label" for="db2_edit">融航AMS资管平台</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input edit-db-checkbox" type="checkbox" value="rag_bge_m3_structured_v4_3" id="db3_edit">
                                        <label class="form-check-label" for="db3_edit">融航HMS资产管理平台</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input edit-db-checkbox" type="checkbox" value="rag_bge_m3_structured_v4_4" id="db4_edit">
                                        <label class="form-check-label" for="db4_edit">核算模块</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input edit-db-checkbox" type="checkbox" value="rag_bge_m3_structured_v4_5" id="db5_edit">
                                        <label class="form-check-label" for="db5_edit">随心易终端</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="editId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>具体功能&相关模块 (object)</label>
                                <input type="text" class="form-control" id="editObject" list="objectOptions" placeholder="可选择或手动输入">
                                <datalist id="objectOptions"></datalist>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>问题类型 (type)</label>
                                <input type="text" class="form-control" id="editType" list="typeOptions" placeholder="可选择或手动输入">
                                <datalist id="typeOptions"></datalist>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>应用场景 (purpose)</label>
                                <input type="text" class="form-control" id="editPurpose" list="purposeOptions" placeholder="可选择或手动输入">
                                <datalist id="purposeOptions"></datalist>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>客户类型 (customer_type)</label>
                                <input type="text" class="form-control" id="editCustomerType" list="customerOptions" placeholder="可选择或手动输入">
                                <datalist id="customerOptions"></datalist>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>关键词 (keyword)</label>
                            <input type="text" class="form-control" id="editKeyword">
                        </div>
                        <div class="mb-3">
                            <label>类似问题 (problem) 多行</label>
                            <textarea class="form-control" id="editProblem" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>回复内容 (text)</label>
                            <textarea class="form-control" id="editText" rows="6"></textarea>
                        </div>
                        <!-- 多图片支持 -->
                        <div class="mb-3">
                            <label class="form-label">当前图片</label>
                            <div id="currentImageList" class="form-text text-muted"></div>
                        </div>
                        <div class="mb-3">
                            <label for="editImage" class="form-label">新增图片（可多选）</label>
                            <input type="file" class="form-control" id="editImage" accept="image/*" multiple>
                        </div>
                        <!-- 多文档支持 -->
                        <div class="mb-3">
                            <label class="form-label">当前文档</label>
                            <div id="currentDocumentList" class="form-text text-muted"></div>
                        </div>
                        <div class="mb-3">
                            <label for="editDocument" class="form-label">新增文档（可多选，支持 PDF/DOCX）</label>
                            <input type="file" class="form-control" id="editDocument" accept=".pdf,.docx" multiple>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('editModal')">取消</button>
                        <button class="btn btn-primary" onclick="saveEdit().catch(e => { console.error(e); alert('保存出错：' + e.message); })">保存修改</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图片预览模态框 -->
        <div id="previewModal" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">🖼️ 图片预览</h5>
                        <span class="close" onclick="closeModal('previewModal')">&times;</span>
                    </div>
                    <div class="modal-body">
                        <img id="previewImage" src="" class="img-fluid">
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('previewModal')">关闭</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作日志模态框 -->
        <div id="logModal" class="modal">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">📜 操作日志</h5>
                        <span class="close" onclick="closeModal('logModal')">&times;</span>
                    </div>
                    <div class="modal-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>用户</th>
                                    <th>操作</th>
                                    <th>集合</th>
                                    <th>记录ID</th>
                                    <th>详情</th>
                                </tr>
                            </thead>
                            <tbody id="logTable"></tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal('logModal')">关闭</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 登录模态框 -->
        <div id="loginModal" class="modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">🔐 用户登录</h5>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="loginUsername" placeholder="请输入用户名">
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">密码</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码">
                        </div>
                        <div class="alert alert-danger d-none" id="loginError">错误信息</div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" onclick="doLogin()">登录</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        let currentCollection = '';
        let currentData = [];
        let authToken = localStorage.getItem('authToken') || '';
        let currentUsername = '';

        function getAuthHeaders() {
            return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
        }

        async function authFetch(url, options = {}) {
            options.headers = {
                ...options.headers,
                ...getAuthHeaders()
            };
            const res = await fetch(url, options);
            if (res.status === 401) {
                logout();
                return null;
            }
            return res;
        }

        function checkLogin() {
            if (!authToken) {
                showLogin();
                return false;
            }
            authFetch('/admin/whoami')
                .then(res => res ? res.json() : null)
                .then(data => {
                    if (data && data.username) {
                        currentUsername = data.username;
                        document.getElementById('currentUserDisplay').textContent = '当前用户：' + currentUsername;
                        if (currentUsername === 'admin') {
                            const reviewOption = document.createElement('option');
                            reviewOption.value = '__REVIEW__';
                            reviewOption.textContent = '🔍 审核内容';
                            // 防止重复添加
                            if (!document.querySelector('option[value="__REVIEW__"]')) {
                                document.getElementById('collectionSelect').appendChild(reviewOption);
                            }
                        }
                    
                    } else {
                        showLogin();
                    }
                })
                .catch(showLogin);
           
        }

        function showLogin() {
            document.getElementById('loginModal').style.display = 'block';
        }

        function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            errorDiv.classList.add('d-none');

            if (!username || !password) {
                errorDiv.textContent = '请输入用户名和密码';
                errorDiv.classList.remove('d-none');
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    authToken = data.token;
                    currentUsername = data.username;
                    localStorage.setItem('authToken', authToken);
                    document.getElementById('currentUserDisplay').textContent = '当前用户：' + currentUsername;
                    closeModal('loginModal');
                    if (document.getElementById('collectionSelect').value) {
                        loadData(document.getElementById('collectionSelect').value);
                    }
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.classList.remove('d-none');
                }
            })
            .catch(err => {
                console.error('登录错误:', err);
                errorDiv.textContent = '网络错误，请重试';
                errorDiv.classList.remove('d-none');
            });
        }

        function logout() {
            authToken = '';
            currentUsername = '';
            localStorage.removeItem('authToken');
            document.getElementById('currentUserDisplay').textContent = '';
            const reviewOption = document.querySelector('option[value="__REVIEW__"]');
            if (reviewOption) {
                reviewOption.remove();
            }
    
            showLogin();
        }

        function loadData(collection) {
            if (collection === '__REVIEW__') {
                loadReviewData();
                return;
            }
            currentCollection = collection;
            if (!collection) {
                alert('请选择一个数据库');
                return;
            }
            // 重置筛选条件
            document.getElementById('filterObject').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterPurpose').value = '';
            document.getElementById('filterCustomerType').value = '';
            document.getElementById('searchInput').value = '';

            authFetch(`/admin/get_data_paginated?collection=${collection}&page=1&page_size=13683`)
                .then(res => res ? res.json() : null)
                .then(data => {
                    if (!data) return;
                    if (data.error) {
                        alert('加载失败: ' + data.error);
                        return;
                    }
                    currentData = data.data;
                    const tbody = document.querySelector('#dataTable tbody');
                    tbody.innerHTML = '';
                    const thead = document.querySelector('#dataTable thead tr');
                    thead.innerHTML = `
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>ID</th>
                        <th>具体功能&相关模块</th>
                        <th>问题类型</th>
                        <th>应用场景</th>
                        <th>客户类型</th>
                        <th>关键词</th>
                        <th>类似问题</th>
                        <th>回复内容</th>
                        <th>更新时间</th>
                        <th>图片</th>
                        <th>文档</th>
                        <th>操作</th>
                    `;
                    data.data.forEach((item, index) => {
                        const idStr = String(item.id);
                        const row = tbody.insertRow();
                        
                        // 解析图片和文档URL
                        const imageUrls = safeParseFileUrls(item.image_url);
                        const fileUrls = safeParseFileUrls(item.file_url);
                        
                        row.innerHTML = `
                            <td><input type="checkbox" name="selectRow" value="${idStr}"></td>
                            <td>${idStr}</td> 
                            <td>${item.object || 'N/A'}</td>
                            <td>${item.type || 'N/A'}</td>
                            <td>${item.purpose || 'N/A'}</td>
                            <td>${item.customer_type || 'N/A'}</td>
                            <td>${item.keyword || 'N/A'}</td>
                            <td>${item.problem ? JSON.parse(item.problem).join('; ') : 'N/A'}</td>
                            <td>${item.text || 'N/A'}</td>
                            <td>${item.updated_at || 'N/A'}</td>
                            <td>
                                <!-- 图片缩略图 -->
                                <div style="display: flex; flex-wrap: wrap; gap: 5px; max-width: 150px;">
                                    ${imageUrls.length > 0 && imageUrls[0] !== "N/A" ? 
                                        imageUrls.map(url => `
                                            <div style="position: relative; width: 40px; height: 40px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; cursor: pointer;">
                                                <img src="${url}" style="width: 100%; height: 100%; object-fit: cover;" 
                                                    onclick="showDataImageModal('${url}')" title="点击查看大图">
                                            </div>
                                        `).join('') : 
                                        '<span style="color: #999; font-size: 12px;">无图片</span>'
                                    }
                                </div>
                            </td>
                            <td>
                                <!-- 文档链接 -->
                                <div style="max-width: 150px;">
                                    ${fileUrls.length > 0 && fileUrls[0] !== "N/A" ? 
                                        fileUrls.map(url => {
                                            const fileName = url.split('/').pop();
                                            return `
                                                <a href="${url}" target="_blank" style="color: #1976d2; text-decoration: none; display: block; margin-bottom: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${fileName}">
                                                    📄 ${fileName.length > 15 ? fileName.substring(0,15)+'...' : fileName}
                                                </a>
                                            `;
                                        }).join('') : 
                                        '<span style="color: #999; font-size: 12px;">无文档</span>'
                                    }
                                </div>
                            </td>
                            <td style="white-space: nowrap; text-align: right;">
                                <button class="btn btn-sm btn-warning mb-1" onclick="editRecord(${index})">编辑</button><br>
                                <button class="btn btn-sm btn-danger mb-1" onclick="deleteRecord('${idStr}')">删除</button>
                            </td>
                        `;
                    });
                    populateFilterOptions(data.data);
                    applyFilters();
                    document.getElementById('totalInfo').textContent = `总计: ${data.total} 条`;

                    // ✅ 新增：重置操作按钮为普通模式
                    document.querySelector('.btn-primary').textContent = '🔄 刷新';
                    document.querySelector('.btn-danger').textContent = '🗑️ 批量删除';
                    document.querySelector('.btn-primary').onclick = () => loadData(currentCollection);
                    document.querySelector('.btn-danger').onclick = batchDelete;

                })
                .catch(err => {
                    console.error('加载错误:', err);
                    alert('加载数据失败');
                });
        }
        // 完全替换原来的 loadReviewData() 或在 <script> 里新增这个函数
        async function loadReviewData() {
            currentCollection = '__REVIEW__';
            document.getElementById('totalInfo').textContent = '正在加载审核数据...';

            // 更稳妥的映射方式：直接用 collection 全名 → 中文名
            const DB_CHINESE_MAP = {
                "rag_bge_m3_structured_v4_1": "融航期货交易平台",
                "rag_bge_m3_structured_v4_2": "融航AMS资管平台",
                "rag_bge_m3_structured_v4_3": "融航HMS资产管理平台",
                "rag_bge_m3_structured_v4_4": "核算模块",
                "rag_bge_m3_structured_v4_5": "随心易终端"
            };

            try {
                const res = await authFetch('/admin/get_review_data');
                if (!res) return;
                const records = await res.json();

                currentData = records;

                // ================== 关键修复：强制插入按钮区（保持你原来的逻辑不变）==================
                let reviewButtons = document.getElementById('reviewActionButtons');
                if (!reviewButtons) {
                    const selectWrapper = document.querySelector('#collectionSelect').parentElement.parentElement;
                    reviewButtons = document.createElement('div');
                    reviewButtons.id = 'reviewActionButtons';

        // 批量通过
        async function batchApprove() {
            const checked = document.querySelectorAll('#dataTable .row-checkbox:checked');
            if (checked.length === 0) return alert('请至少选择一条记录');
            if (!confirm(`确定将这 ${checked.length} 条记录通过并入库？`)) return;

            const ids = Array.from(checked).map(cb => cb.dataset.id);
            const records = currentData.filter(r => ids.includes(r.id));

            const res = await authFetch('/admin/approve_records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids, records })
            });
            const result = await res.json();
            if (result.success) {
                alert(`成功通过 ${checked.length} 条记录`);
                loadReviewData();
            } else {
                alert('通过失败：' + result.error);
            }
        }

        // 批量拒绝（带理由输入框）
        async function batchReject() {
            const checked = document.querySelectorAll('#dataTable .row-checkbox:checked');
            if (checked.length === 0) return alert('请至少选择一条记录');

            const reason = prompt(`请输入拒绝原因（会发给上传人）：`, '');
            if (reason === null) return; // 取消
            if (!reason.trim()) return alert('拒绝原因不能为空');

            if (!confirm(`确定拒绝这 ${checked.length} 条记录？`)) return;

            const ids = Array.from(checked).map(cb => cb.dataset.id);
            const records = currentData.filter(r => ids.includes(r.id));

            const res = await authFetch('/admin/reject_records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids, records, reject_reason: reason })
            });
            const result = await res.json();
            if (result.success !== false) {
                alert(`已拒绝 ${checked.length} 条记录，已归档到被拒区`);
                loadReviewData();
            } else {
                alert('拒绝失败：' + result.error);
            }
        }

        // ========== 安全解析函数（修复编辑无响应问题）==========
        function safeParseFileUrls(value) {
            if (!value || value === 'N/A') {
                return [];
            }
            if (Array.isArray(value)) {
                return value;
            }
            if (typeof value === 'string' && !value.startsWith('[')) {
                return [value];
            }
            try {
                const parsed = JSON.parse(value);
                if (Array.isArray(parsed)) {
                    return parsed;
                } else {
                    return [parsed];
                }
            } catch (e) {
                console.warn('解析文件URL失败，回退为单个URL:', value, e);
                return [value];
            }
        }

        async function saveEdit() {
            const modal = document.getElementById('editModal');
            if (!modal) return;

            // 判断模式：优先使用 currentCollection（最可靠），其次用 dataset
            const isReviewMode = currentCollection === '__REVIEW__' || modal.dataset.mode === 'review';

            // ========== 1. 安全收集要保留的旧文件（关键修复！）==========
            let newImageUrls = [];
            document.querySelectorAll('#currentImageList .file-item').forEach(item => {
                if (item.dataset.url) {
                    newImageUrls.push(item.dataset.url);
                }
            });

            let newFileUrls = [];
            document.querySelectorAll('#currentDocumentList .file-item').forEach(item => {
                if (item.dataset.url) {
                    newFileUrls.push(item.dataset.url);
                }
            });

            // ========== 2. 上传新图片 ==========
            const imageInput = document.getElementById('editImage');
            if (imageInput && imageInput.files.length > 0) {
                for (let file of imageInput.files) {
                    const formData = new FormData();
                    formData.append('image', file);
                    const res = await fetch('/upload_image', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: formData
                    });
                    if (!res.ok) {
                        alert(`图片 ${file.name} 上传失败`);
                        return;
                    }
                    const json = await res.json();
                    if (json.success && json.url) {
                        newImageUrls.push(json.url);
                    } else {
                        alert(json.error || '图片上传失败');
                        return;
                    }
                }
            }

            // ========== 3. 上传新文档 ==========
            const docInput = document.getElementById('editDocument');
            if (docInput && docInput.files.length > 0) {
                for (let file of docInput.files) {
                    const formData = new FormData();
                    formData.append('document', file);
                    const res = await fetch('/upload_document', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: formData
                    });
                    if (!res.ok) {
                        alert(`文档 ${file.name} 上传失败`);
                        return;
                    }
                    const json = await res.json();
                    if (json.success && json.url) {
                        newFileUrls.push(json.url);
                    } else {
                        alert(json.error || '文档上传失败');
                        return;
                    }
                }
            }

            // ========== 4. 组装基础数据 ==========
            const submitData = {
                id: document.getElementById('editId')?.value || '',
                object: document.getElementById('editObject')?.value.trim() || '',
                type: document.getElementById('editType')?.value.trim() || '',
                purpose: document.getElementById('editPurpose')?.value.trim() || '',
                customer_type: document.getElementById('editCustomerType')?.value.trim() || '',
                keyword: document.getElementById('editKeyword')?.value.trim() || '',
                problem: (document.getElementById('editProblem')?.value || '')
                            .split('\n').map(s => s.trim()).filter(s => s),
                text: document.getElementById('editText')?.value.trim() || '',
                image_url: newImageUrls.length ? newImageUrls : ["N/A"],
                file_url: newFileUrls.length ? newFileUrls : ["N/A"]
            };

            let url, body;

            if (isReviewMode) {
                // ========== 审核模式：处理 selected_dbs ==========
                url = '/admin/update_review_record';

                const selectedDbs = [];
                const dbCheckboxes = document.querySelectorAll('#editModal .edit-db-checkbox:checked');
                dbCheckboxes.forEach(cb => {
                    if (cb.value) selectedDbs.push(cb.value);
                });

                if (selectedDbs.length === 0) {
                    alert('请至少选择一个目标数据库！');
                    return;
                }

                body = {
                    id: submitData.id,
                    selected_dbs: selectedDbs,
                    data: {
                        object: submitData.object,
                        type: submitData.type,
                        purpose: submitData.purpose,
                        customer_type: submitData.customer_type,
                        keyword: submitData.keyword,
                        problem: submitData.problem,
                        text: submitData.text,
                        image_url: submitData.image_url,
                        file_url: submitData.file_url
                    }
                };

            } else {
                // ========== 正式库模式：不传 selected_dbs ==========
                url = `/admin/update_record?collection=${currentCollection}`;
                body = {
                    id: submitData.id,
                    object: submitData.object,
                    type: submitData.type,
                    purpose: submitData.purpose,
                    customer_type: submitData.customer_type,
                    keyword: submitData.keyword,
                    problem: submitData.problem,
                    text: submitData.text,
                    image_url: submitData.image_url,
                    file_url: submitData.file_url
                };
            }

            // ========== 5. 提交请求 ==========
            try {
                const res = await authFetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const result = res ? await res.json() : null;

                if (res?.ok && result?.success !== false) {
                    alert(result?.message || '保存成功！');
                    closeModal('editModal');
                    modal.dataset.mode = ''; // 清除模式标记

                    if (isReviewMode) {
                        loadReviewData();
                    } else {
                        loadData(currentCollection);
                    }
                } else {
                    alert('更新失败: ' + (result?.error || '服务器无响应'));
                }
            } catch (err) {
                console.error('更新请求错误:', err);
                alert('网络错误: ' + err.message);
            }
        }

        // ========== 筛选和搜索 ==========
        function populateFilterOptions(data) {
            const fields = {
                'filterObject': 'object',
                'filterType': 'type',
                'filterPurpose': 'purpose',
                'filterCustomerType': 'customer_type'
            };

            const presets = {
                object: ['报表导出', '净头寸', '订单管理', '用户权限', '风险设置'],
                type: ['权限说明', '解释概念', '操作步骤', '故障排查', '故障说明', '数据查询'],
                purpose: ['审计合规', '用户咨询', '内部培训', '系统帮助', '客户支持'],
                customer_type: ['系统管理员', '个人客户', '机构客户', '内部员工', '合作伙伴']
            };

            for (let [selectId, fieldName] of Object.entries(fields)) {
                const select = document.getElementById(selectId);
                const currentVal = select.value;
                select.innerHTML = '<option value="">全部</option>';
                
                const uniqueValues = [...new Set(data.map(item => item[fieldName] || '').filter(v => v))].sort();
                const valuesToUse = uniqueValues.length > 0 ? uniqueValues : presets[fieldName];

                valuesToUse.forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    select.appendChild(option);
                });

                if (valuesToUse.includes(currentVal)) {
                    select.value = currentVal;
                }
            }
        }

        function applyFilters() {
            const filters = {
                object: document.getElementById('filterObject').value,
                type: document.getElementById('filterType').value,
                purpose: document.getElementById('filterPurpose').value,
                customer_type: document.getElementById('filterCustomerType').value
            };
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            const tbody = document.querySelector('#dataTable tbody');
            let visibleCount = 0;

            currentData.forEach((item, index) => {
                const row = tbody.rows[index];
                if (!row) return;

                let match = true;
                for (let [field, value] of Object.entries(filters)) {
                    if (value && item[field] !== value) {
                        match = false;
                        break;
                    }
                }

                if (match && searchTerm) {
                    const searchableFields = [
                        item.keyword || '',
                        item.problem ? JSON.parse(item.problem).join(' ') : '',
                        item.text || ''
                    ];
                    const searchText = searchableFields.join(' ').toLowerCase();
                    if (!searchText.includes(searchTerm)) {
                        match = false;
                    }
                }

                if (match) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            document.getElementById('totalInfo').textContent = `总计: ${currentData.length} 条，当前显示: ${visibleCount} 条`;
        }
