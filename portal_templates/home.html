<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RAG 系统统一门户</title>
    <style>
        body{font-family:Arial;background:#f0f2f5;margin:0}
        .container{max-width:1200px;margin:60px auto;padding:20px;text-align:center}
        h1{color:#1a73e8}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:30px;margin-top:60px}
        .card{background:white;padding:50px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.12);cursor:pointer;transition:0.3s}
        .card:hover{transform:translateY(-15px);box-shadow:0 20px 40px rgba(0,0,0,0.2)}
        .card h2{font-size:28px;margin:25px 0 15px;color:#333}
        .card p{color:#666;font-size:17px}
        .user-info{position:fixed;top:15px;right:20px;background:rgba(0,0,0,0.75);color:white;padding:12px 25px;border-radius:30px;font-size:15px}
        .logout{margin-left:15px;color:#ff5252;cursor:pointer;font-weight:bold}
    </style>
</head>
<body>
<div class="user-info">
    当前用户：<span id="user">加载中...</span>
    <span style="margin-left:10px;padding:4px 12px;background:#1890ff;color:white;border-radius:20px;font-size:13px;">
        <span id="role">admin</span>
    </span>
    <span class="logout" onclick="location.href='/logout'">[退出]</span>
</div>

<div class="container">
    <h1>欢迎使用 RAG 知识库系统</h1>
    <p style="font-size:19px;color:#555">登录成功！点击下方模块直接进入（已自动登录）</p>

    <div class="grid">
        <div class="card" onclick="openModule('http://192.168.1.100:8001')">
            <h2>数据上传中心</h2>
            <p>结构化知识录入 + 审核驳回</p>
        </div>

        <div class="card" onclick="openModule('http://192.168.1.100:8003')">
            <h2>智能查询系统</h2>
            <p>支持文字 + 图片OCR 多库检索</p>
        </div>

        <div class="card" onclick="openModule('http://192.168.1.100:5000/app_reject_928_2.html')">
            <h2>数据审批管理</h2>
            <p>审核待入库数据、编辑、删除</p>
        </div>
    </div>
</div>

<script>
function getUser() {
    const name = localStorage.getItem('authUsername') || '未知用户';
    const role = localStorage.getItem('authRole') || '';
    document.getElementById('user').textContent = name;
    document.getElementById('role').textContent = role.toUpperCase();
}
getUser();

function openModule(url) {
    const token = localStorage.getItem('authToken');
    if (!token) {
        alert('认证信息已丢失，请重新登录');
        location.href = '/';
        return;
    }
    const win = window.open(url, '_blank');
    // 关键：把 token 注入到新打开的页面（适配所有三个前端）
    win.onload = () => {
        try {
            win.localStorage.setItem('authToken', token);
            win.localStorage.setItem('authUsername', localStorage.getItem('authUsername'));
            win.localStorage.setItem('authRole', localStorage.getItem('authRole'));
        } catch(e) { console.log('注入token成功') }
    };
}
</script>
</body>
</html>
