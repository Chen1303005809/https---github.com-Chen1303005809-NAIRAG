<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG 统一门户</title>
    <style>
        :root {
            --bg: #f3f7fb;
            --card: #ffffff;
            --line: #dbe4ee;
            --text: #0f172a;
            --muted: #475569;
            --a: #0ea5e9;
            --b: #059669;
            --c: #f59e0b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
        .head {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            padding: 14px 24px;
            align-items: center;
        }
        .head .user { color: var(--muted); font-size: 14px; }
        .role { margin-left: 8px; padding: 4px 10px; border-radius: 999px; background: #e0f2fe; color: #0369a1; }
        .logout { border: 1px solid #fecaca; background: #fff1f2; color: #be123c; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
        .container { max-width: 1100px; margin: 28px auto 46px; padding: 0 18px; }
        h1 { margin: 0 0 8px; font-size: 34px; }
        .sub { margin: 0; color: var(--muted); }
        .grid {
            margin-top: 24px;
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
        .tag { display: inline-block; padding: 4px 10px; font-size: 12px; border-radius: 999px; margin-bottom: 12px; }
        .tag.upload { background: rgba(14,165,233,.12); color: #0369a1; }
        .tag.search { background: rgba(5,150,105,.12); color: #047857; }
        .tag.admin { background: rgba(245,158,11,.14); color: #b45309; }
        .card h2 { margin: 0 0 10px; font-size: 22px; }
        .card p { margin: 0; color: var(--muted); line-height: 1.6; }
    </style>
</head>
<body>
<div class="head">
    <div class="user">
        当前用户: <strong id="user">加载中...</strong>
        <span class="role" id="role">ROLE</span>
    </div>
    <button class="logout" onclick="location.href='/logout'">退出登录</button>
</div>

<div class="container">
    <h1>RAG 协同工作台</h1>
    <p class="sub">已登录成功，请选择要进入的系统模块</p>

    <div class="grid">
        <div class="card" onclick="openModule('http://192.168.1.100:8001')">
            <span class="tag upload">UPLOAD · 8001</span>
            <h2>数据采集端</h2>
            <p>结构化录入、附件上传、待审入队。支持被拒数据回改后重新提交。</p>
        </div>

        <div class="card" onclick="openModule('http://192.168.1.100:8003')">
            <span class="tag search">SEARCH · 8003</span>
            <h2>智能查询端</h2>
            <p>支持文本 + OCR 图片查询，并按文档聚合展示 chunk，结果更清晰。</p>
        </div>

        <div class="card" onclick="openModule('http://192.168.1.100:5000/app_reject_928_2.html')">
            <span class="tag admin">ADMIN · 5000</span>
            <h2>审批与管理端</h2>
            <p>处理待审数据、批量通过/拒绝、文档分组管理、用户权限维护。</p>
        </div>
    </div>
</div>

<script>
(function bindUser() {
    const username = localStorage.getItem('authUsername') || '未知用户';
    const role = (localStorage.getItem('authRole') || 'user').toUpperCase();
    document.getElementById('user').textContent = username;
    document.getElementById('role').textContent = role;
})();

function openModule(url) {
    const authToken = localStorage.getItem('authToken');
    if (!authToken) {
        alert('认证信息缺失，请重新登录');
        location.href = '/';
        return;
    }

    const win = window.open(url, '_blank');
    if (!win) {
        alert('浏览器拦截了新窗口，请允许弹窗后重试');
        return;
    }

    const payload = {
        authToken: authToken,
        flaskToken: localStorage.getItem('flaskToken') || '',
        authUsername: localStorage.getItem('authUsername') || '',
        authRole: localStorage.getItem('authRole') || ''
    };

    const inject = () => {
        try {
            Object.entries(payload).forEach(([k, v]) => win.localStorage.setItem(k, v));
        } catch (_) {}
    };

    inject();
    setTimeout(inject, 300);
    setTimeout(inject, 1000);
}
</script>
</body>
</html>
