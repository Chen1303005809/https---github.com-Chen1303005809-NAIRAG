version: '3.5'

services:
  milvus-standalone:
    image: milvusdb/milvus:v2.3.0
    container_name: milvus-standalone
    restart: always
    ports:
      - "19530:19530"  # Milvus gRPC
      - "9091:9091"    # HTTP API / health
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  milvus_data:
