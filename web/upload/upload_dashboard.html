<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据采集端</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #e3e8f2;
            --text: #25314c;
            --muted: #6f7a94;
            --primary: #344767;
            --primary-hover: #2a3858;
            --danger: #ea0606;
            --success: #2dce89;
            --shadow: 0 18px 34px rgba(52, 71, 103, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 10% -4%, rgba(45, 206, 137, 0.16), transparent 36%),
                radial-gradient(circle at 94% 6%, rgba(52, 71, 103, 0.14), transparent 32%),
                var(--bg);
            color: var(--text);
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(140deg, #252f4a, #344767);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            gap: 10px;
            flex-wrap: wrap;
            color: #fff;
        }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 0.2px; }
        .container { max-width: 1180px; margin: 18px auto 40px; padding: 0 12px; }
        .panel {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .panel-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            font-weight: 700;
            color: var(--primary);
        }
        .panel-body { padding: 14px; }
        .grid2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
        .grid4 { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
        .field { margin-bottom: 10px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #3d4d6d; font-weight: 600; }
        input[type="text"], input[type="password"], select, textarea, input[type="file"] {
            width: 100%;
            border: 1px solid #cfd7e6;
            border-radius: 10px;
            padding: 10px 11px;
            font-size: 14px;
            background: #fff;
            color: var(--text);
        }
        textarea { resize: vertical; min-height: 70px; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #49a3f1;
            box-shadow: 0 0 0 4px rgba(73,163,241,.16);
        }
        .btn {
            border: 0;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 13px;
            cursor: pointer;
            background: #edf1f8;
            color: #31415f;
            font-weight: 600;
            transition: 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn.primary {
            background: linear-gradient(135deg, #344767, #1a2035);
            color: #fff;
            box-shadow: 0 8px 16px rgba(26,32,53,0.25);
        }
        .btn.primary:hover { background: linear-gradient(135deg, #3d4f72, #232b42); }
        .btn.success { background: linear-gradient(135deg, #2dce89, #25b978); color: #fff; }
        .btn.danger { background: linear-gradient(135deg, #f56565, #ea0606); color: #fff; }
        .db-grid {
            border: 1px dashed #ccd6e9;
            border-radius: 12px;
            padding: 10px;
            display: grid;
            gap: 6px;
            background: linear-gradient(140deg, #f9fbff, #f4f7ff);
        }
        .db-grid label { margin: 0; font-weight: 500; color: #3c4c6d; cursor: pointer; }
        .drop {
            border: 1px dashed #adbad3;
            border-radius: 12px;
            background: #f9fbff;
            min-height: 84px;
            padding: 10px;
            color: var(--muted);
        }
        .preview-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 8px; }
        .preview-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 6px;
            position: relative;
            box-shadow: 0 8px 20px rgba(52, 71, 103, 0.08);
        }
        .preview-card img { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; }
        .preview-name { margin-top: 4px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .remove {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 999px;
            border: 0;
            background: rgba(37,47,74,.78);
            color: #fff;
            cursor: pointer;
        }
        .doc-list { display: grid; gap: 6px; margin-top: 8px; }
        .doc-item { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
        .status { font-size: 13px; color: var(--muted); }
        .header .status { color: rgba(255,255,255,0.82); }
        .error { color: var(--danger); }
        .ok { color: var(--success); }
        .badge {
            display: none;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #f56565, #ea0606);
            color: #fff;
            border: 0;
            font-weight: 700;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(17, 25, 40, .56);
        }
        .modal-card {
            width: min(980px, 95vw);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            margin: 30px auto;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .modal-head { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 12px; max-height: 72vh; overflow: auto; }
        .hint { color: var(--muted); font-size: 12px; }
        @media (max-width: 980px) {
            .grid4 { grid-template-columns: repeat(2, 1fr); }
            .grid2 { grid-template-columns: 1fr; }
            .preview-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
        }
        @media (max-width: 640px) {
            .preview-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>数据采集端</h1>
    <div class="toolbar">
        <button class="btn" onclick="location.href='/home'">返回主页面</button>
        <span id="userInfo" class="status">未登录</span>
        <button id="rejectedBadge" class="badge" title="查看被拒记录">!</button>
        <button class="btn" id="logoutBtn" onclick="logout()" style="display:none;">退出</button>
    </div>
</div>

<div class="container">
    <section class="panel" id="loginPanel">
        <div class="panel-head">登录</div>
        <div class="panel-body">
            <div class="grid2">
                <div class="field">
                    <label for="username">用户名</label>
                    <input id="username" type="text" placeholder="请输入用户名" />
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" type="password" placeholder="请输入密码" />
                </div>
            </div>
            <div class="toolbar">
                <button class="btn primary" onclick="login()">登录</button>
                <span id="loginStatus" class="status"></span>
            </div>
        </div>
    </section>

    <section class="panel" id="formPanel" style="display:none;">
        <div class="panel-head">结构化数据录入</div>
        <div class="panel-body">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="field">
                    <label>目标数据库（可多选）</label>
                    <div id="dbChecks" class="db-grid">
                        <label><input type="checkbox" value="rag_bge_m3_structured_v4_1" name="selected_dbs" /> 融航期货交易平台</label>
                        <label><input type="checkbox" value="rag_bge_m3_structured_v4_2" name="selected_dbs" /> 融航AMS资管平台</label>
                        <label><input type="checkbox" value="rag_bge_m3_structured_v4_3" name="selected_dbs" /> 融航HMS资产管理平台</label>
                        <label><input type="checkbox" value="rag_bge_m3_structured_v4_4" name="selected_dbs" /> 核算模块</label>
                        <label><input type="checkbox" value="rag_bge_m3_structured_v4_5" name="selected_dbs" /> 随心易终端</label>
                        <label><input type="checkbox" value="TEST" name="selected_dbs" /> 多模态混合测试</label>
                    </div>
                </div>

                <div class="grid4">
                    <div class="field">
                        <label for="type">问题类型</label>
                        <select id="type"></select>
                    </div>
                    <div class="field">
                        <label for="object">具体功能与模块</label>
                        <select id="object"></select>
                    </div>
                    <div class="field">
                        <label for="purpose">应用场景</label>
                        <select id="purpose"></select>
                    </div>
                    <div class="field">
                        <label for="customer_type">客户类型</label>
                        <select id="customer_type"></select>
                    </div>
                </div>

                <div class="grid2">
                    <div class="field">
                        <label for="reply_logic">回复逻辑框架（必填）</label>
                        <textarea id="reply_logic" required></textarea>
                    </div>
                    <div class="field">
                        <label for="feature_explanation">功能说明（必填）</label>
                        <textarea id="feature_explanation" required></textarea>
                    </div>
                </div>

                <div class="grid2">
                    <div class="field">
                        <label for="example">举例说明（选填）</label>
                        <textarea id="example"></textarea>
                    </div>
                    <div class="field">
                        <label for="notes">注意事项（选填）</label>
                        <textarea id="notes"></textarea>
                    </div>
                </div>

                <div class="grid2">
                    <div class="field">
                        <label for="keyword">关键词（逗号分隔）</label>
                        <input id="keyword" type="text" />
                    </div>
                    <div class="field">
                        <label for="problem">类似问法（每行一条）</label>
                        <textarea id="problem"></textarea>
                    </div>
                </div>

                <div class="grid2">
                    <div class="field">
                        <label for="imgInput">图片附件（拖拽/粘贴）</label>
                        <input id="imgInput" type="file" multiple accept="image/*" />
                        <div id="imgDrop" class="drop" tabindex="0">
                            将图片拖到此区域，或粘贴截图
                            <div id="imgPreview" class="preview-grid"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="docInput">文档附件（PDF/DOCX/DOC/ZIP）</label>
                        <input id="docInput" type="file" multiple accept=".pdf,.docx,.doc,.zip" />
                        <div id="docDrop" class="drop">
                            将文档拖到此区域
                            <div id="docPreview" class="doc-list"></div>
                        </div>
                    </div>
                </div>

                <div class="toolbar" style="margin-top:10px;">
                    <button class="btn primary" type="submit">提交审核</button>
                    <button class="btn" type="button" onclick="resetForm()">重置</button>
                    <span id="submitStatus" class="status"></span>
                </div>
            </form>
        </div>
    </section>
</div>

<div id="rejectedModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <strong>被拒记录</strong>
            <button class="btn" onclick="closeModal('rejectedModal')">关闭</button>
        </div>
        <div class="modal-body" id="rejectedBody"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <strong id="editTitle">修改被拒记录并重提</strong>
            <button class="btn" onclick="closeModal('editModal')">关闭</button>
        </div>
        <div class="modal-body">
            <input id="editRecordId" type="hidden" />
            <input id="editUploader" type="hidden" />

            <div class="field">
                <label>目标数据库（可多选）</label>
                <div id="editDbChecks" class="db-grid"></div>
            </div>

            <div class="grid4">
                <div class="field"><label>问题类型</label><select id="edit_type"></select></div>
                <div class="field"><label>功能模块</label><select id="edit_object"></select></div>
                <div class="field"><label>应用场景</label><select id="edit_purpose"></select></div>
                <div class="field"><label>客户类型</label><select id="edit_customer_type"></select></div>
            </div>

            <div class="grid2">
                <div class="field"><label>回复逻辑框架</label><textarea id="edit_reply_logic"></textarea></div>
                <div class="field"><label>功能说明</label><textarea id="edit_feature_explanation"></textarea></div>
            </div>

            <div class="grid2">
                <div class="field"><label>举例说明</label><textarea id="edit_example"></textarea></div>
                <div class="field"><label>注意事项</label><textarea id="edit_notes"></textarea></div>
            </div>

            <div class="grid2">
                <div class="field"><label>关键词</label><input id="edit_keyword" type="text" /></div>
                <div class="field"><label>类似问法（每行一条）</label><textarea id="edit_problem"></textarea></div>
            </div>

            <div class="field">
                <label>保留附件（取消勾选即移除）</label>
                <div id="editKeepFiles" class="hint"></div>
            </div>

            <div class="grid2">
                <div class="field"><label>新增图片</label><input id="editNewImages" type="file" multiple accept="image/*" /></div>
                <div class="field"><label>新增文档</label><input id="editNewDocs" type="file" multiple accept=".pdf,.docx,.doc,.zip" /></div>
            </div>

            <div class="toolbar">
                <button class="btn success" onclick="submitResubmission()">确认重提</button>
                <span id="editStatus" class="status"></span>
            </div>
        </div>
    </div>
</div>

<div id="submitSuccessModal" class="modal">
    <div class="modal-card" style="width:min(460px,92vw); margin:18vh auto;">
        <div class="modal-head">
            <strong>提交成功</strong>
            <button class="btn" onclick="closeModal('submitSuccessModal')">关闭</button>
        </div>
        <div class="modal-body">
            <p id="submitSuccessText" style="margin:0; line-height:1.75; color:#0f172a;">记录已提交审核。</p>
            <div class="toolbar" style="margin-top:14px; justify-content:flex-end;">
                <button class="btn success" onclick="closeModal('submitSuccessModal')">知道了</button>
            </div>
        </div>
    </div>
</div>

<script>
let authToken = localStorage.getItem('authToken') || '';
let authUsername = localStorage.getItem('authUsername') || '';
let authRole = localStorage.getItem('authRole') || '';
let rejectedCache = [];
let optionCache = {};
const API_BASE = window.location.pathname.startsWith('/upload') ? '/upload' : '';

const DBS = [
    { v: 'rag_bge_m3_structured_v4_1', t: '融航期货交易平台' },
    { v: 'rag_bge_m3_structured_v4_2', t: '融航AMS资管平台' },
    { v: 'rag_bge_m3_structured_v4_3', t: '融航HMS资产管理平台' },
    { v: 'rag_bge_m3_structured_v4_4', t: '核算模块' },
    { v: 'rag_bge_m3_structured_v4_5', t: '随心易终端' },
    { v: 'TEST', t: '多模态混合测试' }
];

function authHeaders(extra = {}) {
    return authToken ? { ...extra, Authorization: `Bearer ${authToken}` } : extra;
}

function apiUrl(path) {
    return `${API_BASE}${path}`;
}

function showSubmitSuccess(message) {
    document.getElementById('submitSuccessText').textContent = message || '记录已提交审核。';
    document.getElementById('submitSuccessModal').style.display = 'block';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function setUserInfo() {
    const text = authUsername ? `当前用户: ${authUsername}${authRole ? ' (' + authRole + ')' : ''}` : '未登录';
    document.getElementById('userInfo').textContent = text;
    document.getElementById('logoutBtn').style.display = authToken ? 'inline-block' : 'none';
}

function showLoggedIn(show) {
    document.getElementById('loginPanel').style.display = show ? 'none' : 'block';
    document.getElementById('formPanel').style.display = show ? 'block' : 'none';
    setUserInfo();
}

function parseProblems(text) {
    return text.split('\n').map(v => v.trim()).filter(Boolean);
}

function selectedDbs(selector = '#dbChecks input:checked') {
    return Array.from(document.querySelectorAll(selector)).map(cb => cb.value);
}

function selectOptions(id, values) {
    const el = document.getElementById(id);
    el.innerHTML = '<option value="">--请选择--</option>' + (values || []).map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');
}

async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) {
        document.getElementById('loginStatus').textContent = '请输入用户名和密码';
        document.getElementById('loginStatus').className = 'status error';
        return;
    }

    const res = await fetch(apiUrl('/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
        document.getElementById('loginStatus').textContent = data.detail || '登录失败';
        document.getElementById('loginStatus').className = 'status error';
        return;
    }

    authToken = data.access_token;
    authUsername = data.username;
    authRole = data.role;
    localStorage.setItem('authToken', authToken);
    localStorage.setItem('authUsername', authUsername);
    localStorage.setItem('authRole', authRole);

    document.getElementById('loginStatus').textContent = `登录成功 (${authRole})`;
    document.getElementById('loginStatus').className = 'status ok';
    showLoggedIn(true);
    await loadOptions();
    await checkRejectedRecords();
}

function logout() {
    authToken = '';
    authUsername = '';
    authRole = '';
    localStorage.removeItem('authToken');
    localStorage.removeItem('authUsername');
    localStorage.removeItem('authRole');
    showLoggedIn(false);
    document.getElementById('rejectedBadge').style.display = 'none';
}

async function ensureLoginByToken() {
    if (!authToken) {
        showLoggedIn(false);
        return;
    }
    try {
        const res = await fetch(apiUrl('/rejected_records'), { headers: authHeaders() });
        if (res.status === 401) return logout();
        showLoggedIn(true);
        await loadOptions();
        await checkRejectedRecords();
    } catch (_) {
        logout();
    }
}

async function loadOptions() {
    const res = await fetch(apiUrl('/options'));
    optionCache = await res.json();
    selectOptions('type', optionCache.type);
    selectOptions('object', optionCache.object);
    selectOptions('purpose', optionCache.purpose);
    selectOptions('customer_type', optionCache.customer_type);

    selectOptions('edit_type', optionCache.type);
    selectOptions('edit_object', optionCache.object);
    selectOptions('edit_purpose', optionCache.purpose);
    selectOptions('edit_customer_type', optionCache.customer_type);

    if (authRole === 'admin') addOptionButtons();
}

function addOptionButtons() {
    ['type', 'object', 'purpose', 'customer_type'].forEach(id => {
        if (document.getElementById(id + '_btn')) return;
        const btn = document.createElement('button');
        btn.id = id + '_btn';
        btn.type = 'button';
        btn.className = 'btn';
        btn.textContent = '管理选项';
        btn.onclick = () => editOptions(id);
        document.querySelector(`label[for="${id}"]`)?.appendChild(btn);
    });
}

async function editOptions(category) {
    const current = optionCache[category] || [];
    const text = prompt(`编辑 ${category} 选项（每行一个）`, current.join('\n'));
    if (text === null) return;
    const items = text.split('\n').map(v => v.trim()).filter(Boolean);
    if (!items.length) return alert('至少保留一个选项');

    const res = await fetch(apiUrl(`/options/${category}`), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(items)
    });
    const data = await res.json();
    if (!res.ok) return alert(data.detail || '更新失败');
    await loadOptions();
}

function syncInputFiles(input, files) {
    const dt = new DataTransfer();
    files.forEach(f => dt.items.add(f));
    input.files = dt.files;
}

function dedupeFiles(input, incoming, acceptDoc = false) {
    const existing = Array.from(input.files || []);
    const map = new Map();
    [...existing, ...incoming].forEach(file => {
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        const docOk = acceptDoc && /\.(pdf|docx|doc|zip)$/i.test(file.name);
        const imgOk = file.type.startsWith('image/');
        if ((acceptDoc ? docOk : imgOk) && !map.has(key)) map.set(key, file);
    });
    syncInputFiles(input, Array.from(map.values()));
}

function renderImagePreview() {
    const input = document.getElementById('imgInput');
    const box = document.getElementById('imgPreview');
    box.innerHTML = '';

    Array.from(input.files || []).forEach(file => {
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        const wrap = document.createElement('div');
        wrap.className = 'preview-card';

        const img = document.createElement('img');
        const reader = new FileReader();
        reader.onload = e => img.src = e.target.result;
        reader.readAsDataURL(file);

        const name = document.createElement('div');
        name.className = 'preview-name';
        name.textContent = file.name;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove';
        btn.textContent = '×';
        btn.onclick = () => {
            const files = Array.from(input.files).filter(f => `${f.name}-${f.size}-${f.lastModified}` !== key);
            syncInputFiles(input, files);
            renderImagePreview();
        };

        wrap.appendChild(img);
        wrap.appendChild(name);
        wrap.appendChild(btn);
        box.appendChild(wrap);
    });
}

function renderDocPreview() {
    const input = document.getElementById('docInput');
    const box = document.getElementById('docPreview');
    box.innerHTML = '';
    Array.from(input.files || []).forEach(file => {
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        const item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = `<span>${escapeHtml(file.name)}</span>`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn danger';
        btn.textContent = '删除';
        btn.onclick = () => {
            const files = Array.from(input.files).filter(f => `${f.name}-${f.size}-${f.lastModified}` !== key);
            syncInputFiles(input, files);
            renderDocPreview();
        };
        item.appendChild(btn);
        box.appendChild(item);
    });
}

async function submitUpload(event) {
    event.preventDefault();
    if (!authToken) return alert('请先登录');

    const dbs = selectedDbs('#dbChecks input:checked');
    if (!dbs.length) return alert('请至少选择一个目标数据库');

    const record = {
        type: document.getElementById('type').value,
        object: document.getElementById('object').value,
        purpose: document.getElementById('purpose').value,
        customer_type: document.getElementById('customer_type').value,
        reply_logic: document.getElementById('reply_logic').value.trim(),
        feature_explanation: document.getElementById('feature_explanation').value.trim(),
        example: document.getElementById('example').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        keyword: document.getElementById('keyword').value.trim(),
        problem: parseProblems(document.getElementById('problem').value)
    };

    if (!record.reply_logic || !record.feature_explanation) {
        return alert('回复逻辑框架和功能说明为必填项');
    }

    const formData = new FormData();
    formData.append('records_json', JSON.stringify([record]));
    dbs.forEach(db => formData.append('selected_dbs', db));
    Array.from(document.getElementById('imgInput').files || []).forEach(f => formData.append('files', f));
    Array.from(document.getElementById('docInput').files || []).forEach(f => formData.append('doc_files', f));

    const res = await fetch(apiUrl('/upload_json'), {
        method: 'POST',
        headers: authHeaders(),
        body: formData
    });
    const data = await res.json();
    if (!res.ok) {
        document.getElementById('submitStatus').textContent = data.detail || '提交失败';
        document.getElementById('submitStatus').className = 'status error';
        return;
    }

    document.getElementById('submitStatus').textContent = '已提交审核';
    document.getElementById('submitStatus').className = 'status ok';
    showSubmitSuccess(`提交成功：已送审 ${dbs.length} 个目标数据库。`);
    resetForm();
    await checkRejectedRecords();
}

function resetForm() {
    document.getElementById('uploadForm').reset();
    renderImagePreview();
    renderDocPreview();
}

async function checkRejectedRecords() {
    if (!authToken) return;
    const res = await fetch(apiUrl('/rejected_records'), { headers: authHeaders() });
    if (res.status === 401) return logout();
    const data = await res.json();
    rejectedCache = data.rejected || [];
    document.getElementById('rejectedBadge').style.display = rejectedCache.length ? 'inline-block' : 'none';
}

function renderRejectedModal() {
    const body = document.getElementById('rejectedBody');
    if (!rejectedCache.length) {
        body.innerHTML = '<div class="hint">暂无被拒记录</div>';
        return;
    }

    body.innerHTML = rejectedCache.map((item, idx) => {
        const files = [...(item.data?.image_url || []), ...(item.data?.file_url || [])]
            .filter(u => u && u !== 'N/A')
            .map(u => `<a class="file-link" href="${u}" target="_blank">${escapeHtml((u || '').split('/').pop())}</a>`)
            .join('');
        return `
            <article class="panel" style="margin-bottom:8px;">
                <div class="panel-body">
                    <div style="display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap;">
                        <strong>#${idx + 1} · ${escapeHtml(item.data?.object || '')}</strong>
                        <button class="btn primary" onclick="openRejectedEdit('${escapeAttr(item.id)}')">修改后重提</button>
                    </div>
                    <div class="hint" style="margin-top:6px; color:#b91c1c;">拒绝原因: ${escapeHtml(item.reject_reason || '管理员未填写')}</div>
                    <div style="margin-top:6px; font-size:13px;">类型: ${escapeHtml(item.data?.type || '')} ｜ 场景: ${escapeHtml(item.data?.purpose || '')}</div>
                    <div style="margin-top:6px; font-size:13px; white-space:pre-wrap;">回复逻辑: ${escapeHtml(item.data?.reply_logic || '')}</div>
                    ${files ? `<div class="toolbar" style="margin-top:8px;">${files}</div>` : ''}
                </div>
            </article>
        `;
    }).join('');
}

function openRejectedEdit(recordId) {
    const rec = rejectedCache.find(r => String(r.id) === String(recordId));
    if (!rec) return;

    document.getElementById('editRecordId').value = rec.id;
    document.getElementById('editUploader').value = rec.uploader || authUsername;
    document.getElementById('edit_type').value = rec.data?.type || '';
    document.getElementById('edit_object').value = rec.data?.object || '';
    document.getElementById('edit_purpose').value = rec.data?.purpose || '';
    document.getElementById('edit_customer_type').value = rec.data?.customer_type || '';
    document.getElementById('edit_reply_logic').value = rec.data?.reply_logic || '';
    document.getElementById('edit_feature_explanation').value = rec.data?.feature_explanation || '';
    document.getElementById('edit_example').value = rec.data?.example || '';
    document.getElementById('edit_notes').value = rec.data?.notes || '';
    document.getElementById('edit_keyword').value = rec.data?.keyword || '';
    document.getElementById('edit_problem').value = (rec.data?.problem || []).join('\n');
    document.getElementById('editNewImages').value = '';
    document.getElementById('editNewDocs').value = '';
    document.getElementById('editStatus').textContent = '';

    const selected = rec.selected_dbs || [];
    document.getElementById('editDbChecks').innerHTML = DBS.map(db => {
        const checked = selected.includes(db.v) ? 'checked' : '';
        return `<label><input type="checkbox" value="${db.v}" ${checked} /> ${db.t}</label>`;
    }).join('');

    const keepUrls = [...(rec.data?.image_url || []), ...(rec.data?.file_url || [])]
        .filter(u => u && u !== 'N/A');
    document.getElementById('editKeepFiles').innerHTML = keepUrls.length
        ? keepUrls.map(url => `<label style="display:block; margin-bottom:5px;"><input type="checkbox" checked data-url="${escapeAttr(url)}" /> ${escapeHtml((url || '').split('/').pop() || url)}</label>`).join('')
        : '<span class="hint">无可保留附件</span>';

    closeModal('rejectedModal');
    document.getElementById('editModal').style.display = 'block';
}

async function submitResubmission() {
    const oldId = document.getElementById('editRecordId').value;
    const uploader = document.getElementById('editUploader').value;
    const dbs = selectedDbs('#editDbChecks input:checked');
    if (!dbs.length) return alert('请至少选择一个目标数据库');

    const recordData = {
        type: document.getElementById('edit_type').value,
        object: document.getElementById('edit_object').value,
        purpose: document.getElementById('edit_purpose').value,
        customer_type: document.getElementById('edit_customer_type').value,
        reply_logic: document.getElementById('edit_reply_logic').value.trim(),
        feature_explanation: document.getElementById('edit_feature_explanation').value.trim(),
        example: document.getElementById('edit_example').value.trim(),
        notes: document.getElementById('edit_notes').value.trim(),
        keyword: document.getElementById('edit_keyword').value.trim(),
        problem: parseProblems(document.getElementById('edit_problem').value)
    };

    const formData = new FormData();
    formData.append('old_record_id', oldId);
    formData.append('uploader', uploader);
    dbs.forEach(v => formData.append('selected_dbs', v));
    formData.append('record_data', JSON.stringify(recordData));

    Array.from(document.querySelectorAll('#editKeepFiles input:checked')).forEach(cb => {
        const url = cb.dataset.url;
        if (/\.(png|jpg|jpeg|gif|bmp|webp|svg)$/i.test(url)) {
            formData.append('keep_image_urls', url);
        } else {
            formData.append('keep_file_urls', url);
        }
    });

    Array.from(document.getElementById('editNewImages').files || []).forEach(f => formData.append('new_images', f));
    Array.from(document.getElementById('editNewDocs').files || []).forEach(f => formData.append('new_docs', f));

    const res = await fetch(apiUrl('/resubmit_rejected'), {
        method: 'POST',
        headers: authHeaders(),
        body: formData
    });
    const data = await res.json();
    if (!res.ok) {
        document.getElementById('editStatus').textContent = data.detail || data.message || '重提失败';
        document.getElementById('editStatus').className = 'status error';
        return;
    }

    document.getElementById('editStatus').textContent = '重提成功';
    document.getElementById('editStatus').className = 'status ok';
    closeModal('editModal');
    await checkRejectedRecords();
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}
function escapeAttr(text) { return escapeHtml(text).replace(/"/g, '&quot;'); }

const imgInput = document.getElementById('imgInput');
const docInput = document.getElementById('docInput');

imgInput.addEventListener('change', e => { dedupeFiles(imgInput, Array.from(e.target.files || []), false); renderImagePreview(); });
docInput.addEventListener('change', e => { dedupeFiles(docInput, Array.from(e.target.files || []), true); renderDocPreview(); });

document.getElementById('imgDrop').addEventListener('dragover', e => { e.preventDefault(); });
document.getElementById('imgDrop').addEventListener('drop', e => { e.preventDefault(); dedupeFiles(imgInput, Array.from(e.dataTransfer.files || []), false); renderImagePreview(); });
document.getElementById('imgDrop').addEventListener('paste', e => {
    const files = [];
    Array.from(e.clipboardData?.items || []).forEach(item => {
        if (item.type.startsWith('image/')) {
            const f = item.getAsFile();
            if (f) files.push(f);
        }
    });
    if (files.length) {
        dedupeFiles(imgInput, files, false);
        renderImagePreview();
    }
});

document.getElementById('docDrop').addEventListener('dragover', e => { e.preventDefault(); });
document.getElementById('docDrop').addEventListener('drop', e => { e.preventDefault(); dedupeFiles(docInput, Array.from(e.dataTransfer.files || []), true); renderDocPreview(); });

document.getElementById('uploadForm').addEventListener('submit', submitUpload);
document.getElementById('rejectedBadge').addEventListener('click', () => { renderRejectedModal(); document.getElementById('rejectedModal').style.display = 'block'; });
window.addEventListener('click', e => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; });

ensureLoginByToken();
setInterval(checkRejectedRecords, 30000);
</script>
</body>
</html>
