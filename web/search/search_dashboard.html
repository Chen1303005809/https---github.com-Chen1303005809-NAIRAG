<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能检索端</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --line: #e3e8f2;
            --text: #25314c;
            --muted: #6f7a94;
            --primary: #344767;
            --primary-hover: #25314c;
            --accent: #49a3f1;
            --ok: #2dce89;
            --warn: #ea0606;
            --shadow: 0 18px 34px rgba(52, 71, 103, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% -5%, rgba(73, 163, 241, 0.2), transparent 35%),
                radial-gradient(circle at 90% 10%, rgba(52, 71, 103, 0.15), transparent 32%),
                var(--bg);
        }
        .top {
            padding: 16px 22px;
            background: linear-gradient(140deg, #252f4a, #344767 70%);
            color: #fff;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }
        .top .home-btn {
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            padding: 7px 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .top .home-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
        .container { max-width: 1240px; margin: 22px auto 42px; padding: 0 14px; }
        .layout { display: grid; grid-template-columns: 390px 1fr; gap: 18px; align-items: start; }
        .panel {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(3px);
        }
        .panel-head {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
        }
        .panel-body { padding: 16px 18px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 13px; color: #3b4a69; }
        input[type="text"], textarea {
            width: 100%;
            border: 1px solid #ced5e4;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 14px;
            transition: .2s border-color, .2s box-shadow;
            background: #fff;
            color: var(--text);
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(73,163,241,0.16);
        }
        .db-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr;
            background: linear-gradient(140deg, #f9fbff, #f4f7ff);
            border: 1px dashed #ccd5e6;
            border-radius: 12px;
            padding: 11px;
        }
        .db-grid label { margin: 0; font-weight: 500; color: #3f4f72; cursor: pointer; }
        .drop {
            border: 1px dashed #a9b7d2;
            border-radius: 12px;
            background: #f8faff;
            min-height: 84px;
            padding: 12px;
            color: var(--muted);
        }
        .preview-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        .preview-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 6px;
            position: relative;
            box-shadow: 0 8px 20px rgba(52, 71, 103, 0.08);
        }
        .preview-item img { width: 100%; height: 112px; object-fit: cover; border-radius: 9px; }
        .preview-name { margin-top: 4px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .remove { position: absolute; top: 6px; right: 6px; border: 0; width: 22px; height: 22px; border-radius: 999px; background: rgba(37,47,74,.75); color: #fff; cursor: pointer; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn {
            border: 0;
            border-radius: 11px;
            padding: 11px 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }
        .btn.primary {
            background: linear-gradient(135deg, #344767, #1a2035);
            color: #fff;
            box-shadow: 0 8px 16px rgba(26, 32, 53, 0.3);
        }
        .btn.primary:hover { background: linear-gradient(135deg, #3d4f72, #232b42); transform: translateY(-1px); }
        .btn.ghost { border: 1px solid #f2bbc0; color: #d33f49; background: #fff7f8; }
        .result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .answer {
            margin-top: 12px;
            background: #f0f7ff;
            border: 1px solid #bfdbfe;
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            line-height: 1.68;
        }
        .query-meta { margin-top: 10px; color: var(--muted); font-size: 13px; }
        .doc-group { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
        .doc-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            background: linear-gradient(145deg, #f8faff, #f3f6fd);
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
        }
        .doc-title { font-weight: 700; font-size: 14px; color: var(--primary); }
        .doc-meta { font-size: 12px; color: var(--muted); }
        .toggle {
            border: 1px solid #bed7ff;
            border-radius: 9px;
            background: #edf4ff;
            color: #3569a8;
            padding: 6px 10px;
            cursor: pointer;
        }
        .chunk-list { display: grid; gap: 10px; padding: 10px 12px; }
        .chunk {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
        }
        .chunk-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .chunk-text { white-space: pre-wrap; line-height: 1.6; font-size: 13px; }
        .chunk-files { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
        .file-link { font-size: 12px; color: #315e95; background: #e8f1ff; border-radius: 999px; padding: 4px 8px; text-decoration: none; }
        .attachment-block { margin-top: 8px; display: grid; gap: 8px; }
        .attachment-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
        .attachment-image {
            display: block;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 20px rgba(52, 71, 103, 0.08);
            text-decoration: none;
        }
        .attachment-image img { width: 100%; height: 106px; object-fit: cover; display: block; }
        .attachment-image span {
            display: block;
            padding: 6px 8px;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .attachment-files { display: flex; flex-wrap: wrap; gap: 6px; }
        .empty { margin-top: 12px; border: 1px dashed #c8d4e8; border-radius: 11px; padding: 14px; color: var(--muted); background: #fbfcff; }
        .error { margin-top: 12px; border: 1px solid #fecaca; background: #fff5f6; color: var(--warn); border-radius: 11px; padding: 12px; }
        .ok { margin-top: 12px; border: 1px solid #b7f0d4; background: #f1fcf7; color: var(--ok); border-radius: 11px; padding: 12px; }
        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .preview-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 640px) {
            .preview-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="top">
    <div id="welcome">智能检索端</div>
    <button class="home-btn" onclick="location.href='/home'">返回主页面</button>
</div>
<div class="container">
    <div class="layout">
        <section class="panel">
            <div class="panel-head">查询输入</div>
            <div class="panel-body">
                <form id="queryForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="session_id">会话 ID</label>
                        <input id="session_id" name="session_id" type="text" value="default" required />
                    </div>

                    <div class="form-group">
                        <label>选择数据库（可多选）</label>
                        <div class="db-grid" id="dbGrid">
                            <label><input type="checkbox" value="rag_bge_m3_structured_v4_1" /> 融航期货交易平台</label>
                            <label><input type="checkbox" value="rag_bge_m3_structured_v4_2" /> 融航AMS资管平台</label>
                            <label><input type="checkbox" value="rag_bge_m3_structured_v4_3" /> 融航HMS资产管理平台</label>
                            <label><input type="checkbox" value="rag_bge_m3_structured_v4_4" /> 核算模块</label>
                            <label><input type="checkbox" value="rag_bge_m3_structured_v4_5" /> 随心易终端</label>
                            <label><input type="checkbox" value="TEST" /> 多模态混合测试</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="query">文字问题</label>
                        <textarea id="query" name="query" rows="4" placeholder="请输入问题，例如：如何计算净头寸？"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="files">图片查询（拖拽 / 粘贴）</label>
                        <input id="files" name="files" type="file" multiple accept="image/*" style="margin-bottom:8px;" />
                        <div id="dropZone" class="drop" tabindex="0">
                            将图片拖到这里，或在此区域粘贴截图
                            <div id="previewList" class="preview-list"></div>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn primary">提交查询</button>
                        <button type="button" class="btn ghost" id="clearBtn">清空会话</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">检索结果（单文档结构化）</div>
            <div class="panel-body">
                <div class="result-head">
                    <strong>结果面板</strong>
                    <span id="resultStat" style="color: var(--muted); font-size: 13px;">尚未查询</span>
                </div>
                <div id="resultContainer" class="empty">提交查询后，将在此展示聚合结果。</div>
            </div>
        </section>
    </div>
</div>

<script>
const inputFiles = document.getElementById('files');
const previewList = document.getElementById('previewList');
const dropZone = document.getElementById('dropZone');
const resultContainer = document.getElementById('resultContainer');
const resultStat = document.getElementById('resultStat');
const API_BASE = window.location.pathname.startsWith('/search') ? '/search' : '';

function apiUrl(path) {
    return `${API_BASE}${path}`;
}

(function bindWelcome() {
    const username = localStorage.getItem('authUsername');
    const role = localStorage.getItem('authRole');
    if (username) {
        document.getElementById('welcome').textContent = `智能检索端 · 当前用户 ${username}${role ? ' (' + role + ')' : ''}`;
    }
})();

function syncFileInput(files) {
    const dt = new DataTransfer();
    files.forEach(f => dt.items.add(f));
    inputFiles.files = dt.files;
}

function getAllFiles() {
    return Array.from(inputFiles.files || []);
}

function setFilesByDedupe(incoming) {
    const existing = getAllFiles();
    const map = new Map();
    [...existing, ...incoming].forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        if (!map.has(key)) map.set(key, file);
    });
    syncFileInput(Array.from(map.values()));
    renderPreview();
}

function removeFileByKey(targetKey) {
    const files = getAllFiles().filter(file => `${file.name}-${file.size}-${file.lastModified}` !== targetKey);
    syncFileInput(files);
    renderPreview();
}

function renderPreview() {
    const files = getAllFiles();
    previewList.innerHTML = '';
    if (!files.length) return;

    files.forEach(file => {
        const key = `${file.name}-${file.size}-${file.lastModified}`;
        const wrap = document.createElement('div');
        wrap.className = 'preview-item';

        const img = document.createElement('img');
        img.alt = file.name;
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        reader.readAsDataURL(file);

        const name = document.createElement('div');
        name.className = 'preview-name';
        name.textContent = file.name;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = '×';
        remove.onclick = () => removeFileByKey(key);

        wrap.appendChild(img);
        wrap.appendChild(name);
        wrap.appendChild(remove);
        previewList.appendChild(wrap);
    });
}

inputFiles.addEventListener('change', e => setFilesByDedupe(Array.from(e.target.files || [])));

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#0284c7'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#94a3b8'; });
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.borderColor = '#94a3b8';
    setFilesByDedupe(Array.from(e.dataTransfer.files || []));
});
dropZone.addEventListener('paste', e => {
    const items = e.clipboardData?.items || [];
    const files = [];
    for (const item of items) {
        if (item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) files.push(file);
        }
    }
    if (files.length) setFilesByDedupe(files);
});

function selectedDatabases() {
    const checks = Array.from(document.querySelectorAll('#dbGrid input[type="checkbox"]:checked'));
    return checks.map(c => c.value);
}

function fallbackGroup(flat) {
    const map = new Map();
    (flat || []).forEach(hit => {
        const doc = hit.doc_id || 'UNKNOWN_DOC';
        if (!map.has(doc)) {
            map.set(doc, { doc_id: doc, best_score: hit.score || 0, chunk_count: 0, field_types: [], file_urls: [], chunks: [] });
        }
        const row = map.get(doc);
        row.chunk_count += 1;
        row.best_score = Math.max(row.best_score, hit.score || 0);
        row.chunks.push(hit);
        if (hit.field_type && !row.field_types.includes(hit.field_type)) row.field_types.push(hit.field_type);
        (hit.file_url || []).forEach(url => {
            if (!url || String(url).trim().toUpperCase() === 'N/A') return;
            if (!row.file_urls.includes(url)) row.file_urls.push(url);
        });
        row.web_links = row.web_links || [];
        (hit.web_links || []).forEach(url => {
            if (!url || String(url).trim().toUpperCase() === 'N/A') return;
            if (!row.web_links.includes(url)) row.web_links.push(url);
        });
    });
    return Array.from(map.values()).sort((a, b) => b.best_score - a.best_score);
}

function clipText(text, max = 72) {
    const plain = String(text || '').replace(/\s+/g, ' ').trim();
    if (!plain) return '';
    return plain.length > max ? plain.slice(0, max) + '…' : plain;
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

function toViewUrl(url) {
    const value = String(url || '').trim();
    if (!value) return '';
    if (/^https?:\/\//i.test(value) || value.startsWith('/')) return value;
    return '/' + value.replace(/^\.?\//, '');
}

function isImageUrl(url) {
    const path = String(url || '').split('?')[0].toLowerCase();
    return /\.(png|jpe?g|gif|webp|bmp|svg|tiff?)$/.test(path);
}

function validUrls(urls) {
    const values = Array.isArray(urls) ? urls : (urls ? [urls] : []);
    const result = [];
    values.forEach(url => {
        const value = String(url || '').trim();
        if (!value || value.toUpperCase() === 'N/A') return;
        if (!result.includes(value)) result.push(value);
    });
    return result;
}

const FIELD_LABELS = {
    type: '问题类型',
    question_type: '问题类型',
    object: '功能模块',
    module: '功能模块',
    purpose: '应用场景',
    scenario: '应用场景',
    customer_type: '客户类型',
    customer: '客户类型',
    keyword: '关键词',
    keywords: '关键词',
    problem: '问题描述',
    question: '问题描述',
    reply_logic: '回复逻辑',
    answer_logic: '回复逻辑',
    feature_explanation: '功能说明',
    explanation: '功能说明',
    example: '举例说明',
    notes: '注意事项',
    image: '图片附件'
};

function fieldLabel(fieldType) {
    const key = String(fieldType || '').trim().toLowerCase();
    return FIELD_LABELS[key] || (fieldType || '未知字段');
}

function summarizeFileNames(urls, limit = 2) {
    const names = validUrls(urls).map(url => decodeURIComponent(url.split('/').pop() || url));
    return names.slice(0, limit).join('、');
}

function buildAttachmentHtml(urls) {
    const all = validUrls(urls).map(raw => {
        const href = toViewUrl(raw);
        const name = decodeURIComponent(href.split('/').pop() || href);
        return { raw, href, hrefEsc: escapeHtml(href), name, image: isImageUrl(href) };
    }).filter(item => !!item.href);
    if (!all.length) return '<span style="font-size:12px; color:#64748b;">无附件</span>';

    const imageItems = all.filter(item => item.image);
    const fileItems = all.filter(item => !item.image);

    const imageHtml = imageItems.length
        ? `<div class="attachment-images">
            ${imageItems.map(item => `
                <a class="attachment-image" href="${item.hrefEsc}" target="_blank" title="${escapeHtml(item.name)}">
                    <img src="${item.hrefEsc}" alt="${escapeHtml(item.name)}" loading="lazy" />
                    <span>${escapeHtml(item.name)}</span>
                </a>
            `).join('')}
           </div>`
        : '';

    const fileHtml = fileItems.length
        ? `<div class="attachment-files">
            ${fileItems.map(item => `<a class="file-link" href="${item.hrefEsc}" target="_blank">${escapeHtml(item.name)}</a>`).join('')}
           </div>`
        : '';

    return `<div class="attachment-block">${imageHtml}${fileHtml}</div>`;
}

function pickBestDoc(textDocs, imageDocs) {
    const merged = [...(textDocs || []), ...(imageDocs || [])];
    if (!merged.length) return { bestDoc: null, candidateCount: 0 };

    const byDoc = new Map();
    for (const doc of merged) {
        const docId = doc.doc_id || 'UNKNOWN_DOC';
        const normalized = {
            ...doc,
            doc_id: docId,
            chunks: Array.isArray(doc.chunks) ? doc.chunks : [],
            file_urls: Array.isArray(doc.file_urls) ? doc.file_urls : [],
            web_links: Array.isArray(doc.web_links) ? doc.web_links : [],
            best_score: Number(doc.best_score || 0),
        };
        const existed = byDoc.get(docId);
        if (!existed) {
            byDoc.set(docId, normalized);
            continue;
        }
        if (normalized.best_score > existed.best_score) {
            byDoc.set(docId, {
                ...normalized,
                chunks: [...normalized.chunks, ...existed.chunks],
                file_urls: Array.from(new Set([...normalized.file_urls, ...existed.file_urls])),
                web_links: Array.from(new Set([...(normalized.web_links || []), ...(existed.web_links || [])])),
            });
        } else {
            existed.chunks = [...existed.chunks, ...normalized.chunks];
            existed.file_urls = Array.from(new Set([...existed.file_urls, ...normalized.file_urls]));
            existed.web_links = Array.from(new Set([...(existed.web_links || []), ...(normalized.web_links || [])]));
            byDoc.set(docId, existed);
        }
    }

    const docs = Array.from(byDoc.values()).sort((a, b) => b.best_score - a.best_score);
    return { bestDoc: docs[0] || null, candidateCount: docs.length };
}

function buildStructuredAnswer(bestDoc) {
    const chunks = [...(bestDoc?.chunks || [])].sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
    const keyPoints = [];
    const seenField = new Set();

    for (const chunk of chunks) {
        const fieldType = chunk.field_type || 'unknown';
        const text = clipText(chunk.field_text, 150);
        if (!text || seenField.has(fieldType)) continue;
        keyPoints.push({
            field_type: fieldType,
            score: Number(chunk.score || 0),
            text,
        });
        seenField.add(fieldType);
        if (keyPoints.length >= 4) break;
    }

    const fallback = chunks.find(c => String(c.field_text || '').trim());
    const conclusion = keyPoints[0]?.text || clipText(fallback?.field_text, 180) || '未提取到可读结论';
    const evidence = chunks.slice(0, 3);
    return { conclusion, keyPoints, evidence };
}

function renderSingleDocStructured(bestDoc, candidateCount) {
    const structured = buildStructuredAnswer(bestDoc);
    const node = document.createElement('div');
    node.className = 'answer';

    const keyPointsHtml = structured.keyPoints.length
        ? `<ol style="margin:8px 0 0 18px; padding:0;">
            ${structured.keyPoints.map(item => `<li style="margin:6px 0;"><strong>${escapeHtml(fieldLabel(item.field_type))}</strong>（${Number(item.score || 0).toFixed(2)}%）：${escapeHtml(item.text)}</li>`).join('')}
          </ol>`
        : `<div style="margin-top:8px; color:#475569;">暂无可结构化要点</div>`;

    const evidenceHtml = structured.evidence.length
        ? structured.evidence.map((chunk, idx) => `
            <div style="margin-top:8px; padding:8px; border:1px solid #bae6fd; border-radius:8px; background:#f0f9ff;">
                <div style="font-size:12px; color:#0369a1;">证据 ${idx + 1} · ${escapeHtml(fieldLabel(chunk.field_type))} · ${Number(chunk.score || 0).toFixed(2)}%</div>
                <div style="font-size:13px; margin-top:4px; color:#0f172a; white-space:pre-wrap;">${escapeHtml(clipText(chunk.field_text, 180))}</div>
            </div>
          `).join('')
        : `<div style="margin-top:8px; color:#475569;">暂无证据片段</div>`;

    const filesHtml = buildAttachmentHtml(bestDoc.file_urls || []);
    const webLinksHtml = validUrls(bestDoc.web_links || [])
        .map(u => `<a class="file-link" href="${escapeHtml(u)}" target="_blank">${escapeHtml(u)}</a>`)
        .join('');

    node.innerHTML = `
        <div><strong>综合结论（仅输出 1 个最相关文档）</strong></div>
        <div style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(structured.conclusion)}</div>
        <div style="margin-top:10px; font-size:13px; color:#0f172a; line-height:1.8;">
            <div><strong>类型:</strong> ${escapeHtml(bestDoc.type || '-')}</div>
            <div><strong>功能:</strong> ${escapeHtml(bestDoc.object || '-')}</div>
            <div><strong>场景:</strong> ${escapeHtml(bestDoc.purpose || '-')}</div>
            <div><strong>客户:</strong> ${escapeHtml(bestDoc.customer_type || '-')}</div>
            <div><strong>网页链接:</strong> ${webLinksHtml || '-'}</div>
        </div>
        <div style="margin-top:10px; font-size:13px; color:#0f172a;">
            <strong>DocID:</strong> ${escapeHtml(bestDoc.doc_id || 'UNKNOWN_DOC')} ｜ 
            <strong>最佳相似度:</strong> ${Number(bestDoc.best_score || 0).toFixed(2)}% ｜ 
            <strong>候选文档数:</strong> ${candidateCount}
        </div>
        <div style="margin-top:10px;">
            <strong style="font-size:13px;">结构化要点</strong>
            ${keyPointsHtml}
        </div>
        <div style="margin-top:10px;">
            <strong style="font-size:13px;">核心证据</strong>
            ${evidenceHtml}
        </div>
        <div style="margin-top:10px;">
            <strong style="font-size:13px;">相关附件</strong>
            <div class="chunk-files" style="margin-top:6px;">${filesHtml}</div>
        </div>
    `;
    return node;
}

function renderDocGroup(title, grouped) {
    const block = document.createElement('div');
    const heading = document.createElement('h3');
    heading.style.margin = '16px 0 8px';
    heading.textContent = title;
    block.appendChild(heading);

    if (!grouped.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暂无结果';
        block.appendChild(empty);
        return block;
    }

    grouped.forEach((doc, idx) => {
        const group = document.createElement('div');
        group.className = 'doc-group';

        const header = document.createElement('div');
        header.className = 'doc-header';
        header.innerHTML = `
            <div>
                <div class="doc-title">DocID: ${doc.doc_id || 'UNKNOWN_DOC'}</div>
                <div class="doc-meta">最佳相似度 ${Number(doc.best_score || 0).toFixed(2)}% · ${doc.chunk_count || 0} 个 chunk</div>
            </div>
            <button type="button" class="toggle">展开 chunks</button>
        `;

        const chunks = document.createElement('div');
        chunks.className = 'chunk-list';
        chunks.style.display = idx === 0 ? 'grid' : 'none';

        (doc.chunks || []).forEach(chunk => {
            const item = document.createElement('div');
            item.className = 'chunk';
            const files = buildAttachmentHtml(chunk.file_url || []);
            item.innerHTML = `
                <div class="chunk-top">
                    <span>chunk: ${chunk.chunk_id ?? '-'} · ${fieldLabel(chunk.field_type)}</span>
                    <span>相似度: ${Number(chunk.score || 0).toFixed(2)}%</span>
                </div>
                <div class="chunk-text">${(chunk.field_text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                ${files ? `<div class="chunk-files">${files}</div>` : ''}
            `;
            chunks.appendChild(item);
        });

        const toggle = header.querySelector('.toggle');
        toggle.onclick = () => {
            const open = chunks.style.display !== 'none';
            chunks.style.display = open ? 'none' : 'grid';
            toggle.textContent = open ? '展开 chunks' : '收起 chunks';
        };
        if (idx === 0) toggle.textContent = '收起 chunks';

        group.appendChild(header);
        group.appendChild(chunks);
        block.appendChild(group);
    });

    return block;
}

function renderResult(data) {
    resultContainer.innerHTML = '';

    if (data.answer === '历史上下文已清空') {
        resultContainer.className = 'ok';
        resultContainer.textContent = '会话历史已清空';
        resultStat.textContent = '已清空';
        return;
    }

    const textDocs = data.grouped_text_results?.length ? data.grouped_text_results : fallbackGroup(data.text_results);
    const imageDocs = data.grouped_image_results?.length ? data.grouped_image_results : fallbackGroup(data.image_results);
    const { bestDoc, candidateCount } = pickBestDoc(textDocs, imageDocs);

    if (!bestDoc) {
        resultStat.textContent = '未命中';
        resultContainer.className = 'empty';
        resultContainer.textContent = '未命中任何文档，请尝试更换关键词或选择更多数据库';
        return;
    }

    resultStat.textContent = `已锁定 1 个文档（候选 ${candidateCount}）`;
    resultContainer.appendChild(renderSingleDocStructured(bestDoc, candidateCount));

    const meta = document.createElement('div');
    meta.className = 'query-meta';
    meta.textContent = `查询串: ${data.query || '-'}${data.extracted_text ? ' ｜ OCR: ' + data.extracted_text : ''}`;
    resultContainer.appendChild(meta);

    resultContainer.appendChild(renderDocGroup('命中片段（仅该文档）', [bestDoc]));

    resultContainer.className = '';
}

function setLoading() {
    resultContainer.className = 'empty';
    resultContainer.textContent = '正在检索，请稍候...';
    resultStat.textContent = '查询中';
}

function setError(message) {
    resultContainer.className = 'error';
    resultContainer.textContent = message;
    resultStat.textContent = '查询失败';
}

document.getElementById('queryForm').addEventListener('submit', async event => {
    event.preventDefault();
    setLoading();

    const form = event.target;
    const formData = new FormData(form);
    formData.set('selected_dbs', selectedDatabases().join(','));

    try {
        const response = await fetch(apiUrl('/query'), { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `请求失败: ${response.status}`);
        renderResult(data);
    } catch (error) {
        setError(error.message || '未知错误');
    }
});

document.getElementById('clearBtn').addEventListener('click', async () => {
    const form = document.getElementById('queryForm');
    const formData = new FormData(form);
    formData.set('query', 'clear');
    formData.set('selected_dbs', selectedDatabases().join(','));
    try {
        setLoading();
        const response = await fetch(apiUrl('/query'), { method: 'POST', body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || `请求失败: ${response.status}`);
        renderResult(data);
        document.getElementById('query').value = '';
    } catch (error) {
        setError(error.message || '清空失败');
    }
});
</script>
</body>
