<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG 统一门户</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --line: #e3e8f2;
            --text: #25314c;
            --muted: #6f7a94;
            --a: #49a3f1;
            --b: #2dce89;
            --c: #fb8c00;
            --shadow: 0 18px 34px rgba(52, 71, 103, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 7% -6%, rgba(73,163,241,0.2), transparent 34%),
                radial-gradient(circle at 95% 12%, rgba(45,206,137,0.16), transparent 32%),
                var(--bg);
        }
        .head {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(140deg, #252f4a, #344767 70%);
            box-shadow: var(--shadow);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            padding: 14px 24px;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .head .user { color: rgba(255,255,255,0.86); font-size: 14px; }
        .role { margin-left: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(73,163,241,0.22); color: #e6f3ff; border: 1px solid rgba(73,163,241,0.45); }
        .logout {
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.12);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
        }
        .container { max-width: 1100px; margin: 28px auto 46px; padding: 0 18px; }
        h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 0.2px; }
        .sub { margin: 0; color: var(--muted); }
        .grid {
            margin-top: 24px;
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .card {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
            box-shadow: var(--shadow);
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 36px rgba(52, 71, 103, 0.18); }
        .tag { display: inline-block; padding: 4px 10px; font-size: 12px; border-radius: 999px; margin-bottom: 12px; font-weight: 700; }
        .tag.upload { background: rgba(73,163,241,.16); color: #2f6ea7; }
        .tag.search { background: rgba(45,206,137,.16); color: #1d8f61; }
        .tag.admin { background: rgba(251,140,0,.16); color: #b86600; }
        .card h2 { margin: 0 0 10px; font-size: 22px; color: #344767; }
        .card p { margin: 0; color: var(--muted); line-height: 1.6; }
    </style>
</head>
<body>
<div class="head">
    <div class="user">
        当前用户: <strong id="user">加载中...</strong>
        <span class="role" id="role">ROLE</span>
    </div>
    <button class="logout" onclick="location.href='logout'">退出登录</button>
</div>

<div class="container">
    <h1>RAG 协同工作台</h1>
    <p class="sub">已登录成功，请选择要进入的系统模块</p>

    <div class="grid">
        <div class="card" onclick="openModule('upload/')">
            <span class="tag upload">UPLOAD</span>
            <h2>数据采集端</h2>
            <p>结构化录入、附件上传、待审入队。支持被拒数据回改后重新提交。</p>
        </div>

        <div class="card" onclick="openModule('search/')">
            <span class="tag search">SEARCH</span>
            <h2>智能查询端</h2>
            <p>支持文本 + OCR 图片查询，并按文档聚合展示 chunk，结果更清晰。</p>
        </div>

        <div class="card" onclick="openModule('admin/admin_dashboard.html')">
            <span class="tag admin">ADMIN</span>
            <h2>审批与管理端</h2>
            <p>处理待审数据、批量通过/拒绝、文档分组管理、用户权限维护。</p>
        </div>
    </div>
</div>

<script>
(function bindUser() {
    const username = localStorage.getItem('authUsername') || '未知用户';
    const role = (localStorage.getItem('authRole') || 'user').toUpperCase();
    document.getElementById('user').textContent = username;
    document.getElementById('role').textContent = role;
})();

function openModule(url) {
    const authToken = localStorage.getItem('authToken');
    if (!authToken) {
        alert('认证信息缺失，请重新登录');
        location.href = '.';
        return;
    }
    location.href = url;
}
</script>
</body>
</html>
