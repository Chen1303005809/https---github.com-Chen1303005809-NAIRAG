<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统一登录门户</title>
    <style>
        :root {
            --bg1: #1a2035;
            --bg2: #344767;
            --bg3: #49a3f1;
            --card: #ffffff;
            --text: #25314c;
            --muted: #6f7a94;
            --primary: #344767;
            --primary-hover: #25314c;
            --ring: rgba(73, 163, 241, 0.2);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 22%, rgba(255,255,255,0.14), transparent 36%),
                radial-gradient(circle at 88% 80%, rgba(255,255,255,0.12), transparent 38%),
                linear-gradient(145deg, var(--bg1), var(--bg2) 62%, var(--bg3));
        }
        .card {
            width: min(92vw, 430px);
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 22px;
            padding: 34px 30px 24px;
            box-shadow: 0 24px 60px rgba(16, 24, 40, 0.35);
            backdrop-filter: blur(4px);
        }
        h1 { margin: 0 0 8px; font-size: 27px; color: #344767; }
        p.subtitle { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
        .field { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #415272; font-weight: 600; }
        input {
            width: 100%;
            border: 1px solid #d3daea;
            border-radius: 11px;
            padding: 12px 13px;
            font-size: 15px;
            transition: .2s border-color, .2s box-shadow;
        }
        input:focus {
            outline: none;
            border-color: #49a3f1;
            box-shadow: 0 0 0 4px var(--ring);
        }
        button {
            width: 100%;
            margin-top: 10px;
            border: 0;
            border-radius: 11px;
            padding: 12px;
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            background: linear-gradient(135deg, #344767, #1a2035);
            cursor: pointer;
            transition: .2s background, .2s transform;
            box-shadow: 0 10px 18px rgba(26,32,53,0.28);
        }
        button:hover { background: linear-gradient(135deg, #3d4f72, #232b42); transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="card">
    <h1>RAG 统一登录</h1>
    <p class="subtitle">登录后将自动同步上传端与管理端认证信息</p>
    <form action="login" method="post">
        <div class="field">
            <label for="username">用户名</label>
            <input id="username" type="text" name="username" placeholder="请输入用户名" required />
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" placeholder="请输入密码" required />
        </div>
        <button type="submit">登录系统</button>
    </form>
</div>
</body>
</html>
