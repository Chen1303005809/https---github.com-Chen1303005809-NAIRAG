<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG 审批与管理端</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #e3e8f2;
            --text: #25314c;
            --muted: #6f7a94;
            --primary: #344767;
            --success: #2dce89;
            --danger: #ea0606;
            --warn: #fb8c00;
            --shadow: 0 18px 34px rgba(52, 71, 103, 0.1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% -5%, rgba(251, 140, 0, 0.16), transparent 36%),
                radial-gradient(circle at 92% 8%, rgba(52, 71, 103, 0.16), transparent 34%),
                var(--bg);
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(140deg, #252f4a, #344767 70%);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: var(--shadow);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: #fff;
        }
        .header strong { font-size: 18px; }
        .container { max-width: 1260px; margin: 16px auto 40px; padding: 0 12px; }
        .toolbar {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .toolbar-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .toolbar-row.right { justify-content: flex-end; }
        select, input[type="text"], textarea, input[type="password"], input[type="file"] {
            border: 1px solid #ced6e6;
            border-radius: 10px;
            padding: 9px 10px;
            font-size: 14px;
            background: #fff;
            color: var(--text);
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #49a3f1;
            box-shadow: 0 0 0 4px rgba(73,163,241,.16);
        }
        .btn {
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            background: #edf1f8;
            color: #31415f;
            font-weight: 600;
            transition: 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn.primary {
            background: linear-gradient(135deg, #344767, #1a2035);
            color: #fff;
            box-shadow: 0 8px 16px rgba(26,32,53,0.24);
        }
        .btn.success { background: linear-gradient(135deg, #2dce89, #25b978); color: #fff; }
        .btn.danger { background: linear-gradient(135deg, #f56565, #ea0606); color: #fff; }
        .btn.warn { background: linear-gradient(135deg, #f9a24f, #fb8c00); color: #fff; }
        .panel {
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .panel-head {
            padding: 12px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .panel-body { padding: 12px; }
        .doc-grid { display: grid; gap: 10px; }
        .doc-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
        .doc-top {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            background: linear-gradient(145deg, #f9fbff, #f4f7ff);
            border-bottom: 1px solid var(--line);
        }
        .doc-title { font-weight: 700; font-size: 14px; color: var(--primary); }
        .doc-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .doc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            background: #eef2fa;
            color: #3f4f72;
            font-size: 12px;
            margin-right: 6px;
            margin-top: 6px;
        }
        .summary { padding: 10px 12px; border-bottom: 1px solid var(--line); }
        .summary-item { margin: 5px 0; font-size: 13px; line-height: 1.5; }
        .summary-label { color: var(--muted); margin-right: 6px; }
        .chunk-list { display: none; padding: 10px 12px; gap: 8px; }
        .chunk { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; }
        .chunk-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .chunk-text { white-space: pre-wrap; font-size: 13px; line-height: 1.55; }
        .files { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .file-link { font-size: 12px; color: #34639c; background: #e8f1ff; text-decoration: none; padding: 4px 8px; border-radius: 999px; }
        .empty { border: 1px dashed #cad5e8; border-radius: 10px; padding: 16px; color: var(--muted); background: #fbfcff; }
        .modal {
            display: none;
            position: fixed;
            z-index: 60;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 25, 40, .56);
        }
        .modal-card {
            width: min(920px, 94vw);
            background: #fff;
            margin: 34px auto;
            border-radius: 14px;
            border: 1px solid var(--line);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .modal-head { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 12px; max-height: 72vh; overflow: auto; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .field { margin-bottom: 10px; }
        .field label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--muted); }
        .footer { padding: 12px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
        .login-box {
            max-width: 360px;
            margin: 90px auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .hint { color: var(--muted); font-size: 12px; }
        .header .hint { color: rgba(255,255,255,0.82); }
        .global-loading {
            position: fixed;
            inset: 0;
            z-index: 120;
            background: rgba(17, 25, 40, .72);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .global-loading-card {
            width: min(520px, 96vw);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
        }
        .global-loading-text {
            color: var(--text);
            font-size: 14px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #d7e8ff;
            border-top-color: #344767;
            border-radius: 999px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 920px) {
            .toolbar { grid-template-columns: 1fr; }
            .toolbar-row.right { justify-content: flex-start; }
            .grid2 { grid-template-columns: 1fr; }
            .doc-top { grid-template-columns: auto 1fr; }
            .doc-actions { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>
<div class="header">
    <strong>审批与管理端</strong>
    <div>
        <span id="whoami" class="hint">未登录</span>
        <button class="btn" onclick="location.href='/home'">返回主页面</button>
        <button class="btn" onclick="logout()">退出</button>
    </div>
</div>

<div id="globalLoading" class="global-loading" style="display:none;">
    <div class="global-loading-card">
        <div class="spinner"></div>
        <div id="globalLoadingText" class="global-loading-text">处理中，请稍候...</div>
    </div>
</div>

<div id="main" class="container" style="display:none;">
    <section class="toolbar">
        <div class="toolbar-row">
            <label for="mode" class="hint">视图</label>
            <select id="mode">
                <option value="data">数据管理</option>
                <option value="review">审核队列</option>
                <option value="rejected">被拒记录</option>
            </select>

            <label for="collection" class="hint">数据库</label>
            <select id="collection">
                <option value="rag_bge_m3_structured_v4_1">融航期货交易平台</option>
                <option value="rag_bge_m3_structured_v4_2">融航AMS资管平台</option>
                <option value="rag_bge_m3_structured_v4_3">融航HMS资产管理平台</option>
                <option value="rag_bge_m3_structured_v4_4">核算模块</option>
                <option value="rag_bge_m3_structured_v4_5">随心易终端</option>
                <option value="TEST">多模态混合测试</option>
            </select>

            <input id="search" type="text" placeholder="按 doc_id / 文本内容搜索" style="min-width:220px;" />
        </div>

        <div class="toolbar-row right">
            <button class="btn primary" onclick="reloadData()">刷新</button>
            <button class="btn danger" id="batchDeleteBtn" onclick="batchDeleteDocs()">批量删除</button>
            <button class="btn success" id="approveBtn" style="display:none;" onclick="batchApprove()">批量通过</button>
            <button class="btn warn" id="rejectBtn" style="display:none;" onclick="batchReject()">批量拒绝</button>
            <button class="btn" onclick="showLogs()">日志</button>
            <button class="btn" onclick="window.open(apiUrl('/user_management.html'), '_blank')">用户管理</button>
        </div>
    </section>

    <section class="panel">
        <div class="panel-head">
            <div>
                <strong id="panelTitle">文档列表</strong>
                <div id="panelStat" class="hint">0 条</div>
            </div>
        </div>
        <div class="panel-body">
            <div id="list" class="doc-grid"></div>
        </div>
    </section>
</div>

<div id="loginModal" class="modal" style="display:block;">
    <div class="login-box">
        <h3 style="margin:0 0 10px;">登录管理端</h3>
        <div class="field">
            <label>用户名</label>
            <input id="loginUser" type="text" placeholder="请输入用户名" />
        </div>
        <div class="field">
            <label>密码</label>
            <input id="loginPass" type="password" placeholder="请输入密码" />
        </div>
        <button class="btn primary" style="width:100%;" onclick="doLogin()">登录</button>
        <div id="loginErr" class="hint" style="margin-top:8px; color:#b91c1c;"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <strong id="editTitle">编辑记录</strong>
            <button class="btn" onclick="closeModal('editModal')">关闭</button>
        </div>
        <div class="modal-body">
            <input id="editRecordId" type="hidden" />
            <input id="editMode" type="hidden" />
            <div class="grid2">
                <div class="field"><label>问题类型</label><input id="editType" type="text" /></div>
                <div class="field"><label>功能模块</label><input id="editObject" type="text" /></div>
                <div class="field"><label>应用场景</label><input id="editPurpose" type="text" /></div>
                <div class="field"><label>客户类型</label><input id="editCustomerType" type="text" /></div>
            </div>
            <div class="field"><label>关键词</label><input id="editKeyword" type="text" /></div>
            <div class="field"><label>类似问题（每行一条）</label><textarea id="editProblem" rows="3"></textarea></div>
            <div class="field"><label>回复逻辑框架</label><textarea id="editReplyLogic" rows="3"></textarea></div>
            <div class="field"><label>功能说明</label><textarea id="editFeature" rows="3"></textarea></div>
            <div class="field"><label>举例说明</label><textarea id="editExample" rows="2"></textarea></div>
            <div class="field"><label>注意事项</label><textarea id="editNotes" rows="2"></textarea></div>

            <div class="field" id="editDbWrap" style="display:none;">
                <label>目标数据库（审核模式）</label>
                <div id="editDbChecks" class="grid2" style="font-size:13px;"></div>
            </div>

            <div class="field"><label>新增图片</label><input id="editImages" type="file" multiple accept="image/*" /></div>
            <div class="field"><label>新增文档</label><input id="editDocs" type="file" multiple accept=".pdf,.docx,.doc,.zip,.xlsx,.xls,.txt" /></div>

            <div class="field">
                <label>保留附件（取消勾选即移除）</label>
                <div id="keepFiles" class="hint"></div>
            </div>
        </div>
        <div class="footer">
            <button class="btn" onclick="closeModal('editModal')">取消</button>
            <button class="btn primary" onclick="saveEdit()">保存</button>
        </div>
    </div>
</div>

<div id="logModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <strong>操作日志</strong>
            <button class="btn" onclick="closeModal('logModal')">关闭</button>
        </div>
        <div class="modal-body">
            <div id="logBody" class="doc-grid"></div>
        </div>
    </div>
</div>

<script>
let authToken = localStorage.getItem('flaskToken') || localStorage.getItem('authToken') || '';
let currentUser = '';
let currentRole = '';
let dataDocs = [];
let reviewRows = [];
let rejectedRows = [];
const API_BASE = window.location.pathname.startsWith('/admin') ? '/admin' : '';
let busyCount = 0;

const DB_OPTIONS = [
    { v: 'rag_bge_m3_structured_v4_1', t: '融航期货交易平台' },
    { v: 'rag_bge_m3_structured_v4_2', t: '融航AMS资管平台' },
    { v: 'rag_bge_m3_structured_v4_3', t: '融航HMS资产管理平台' },
    { v: 'rag_bge_m3_structured_v4_4', t: '核算模块' },
    { v: 'rag_bge_m3_structured_v4_5', t: '随心易终端' },
    { v: 'TEST', t: '多模态混合测试' }
];

function authHeaders(extra = {}) {
    return authToken ? { ...extra, Authorization: 'Bearer ' + authToken } : extra;
}

function apiUrl(path) {
    return `${API_BASE}${path}`;
}

function resolveAssetUrl(url) {
    if (!url) return '';
    if (/^(https?:|data:|blob:)/i.test(url)) return url;
    const s = String(url).trim();
    if (!s.startsWith('/')) return s;
    const staticIdx = s.indexOf('/static/');
    if (staticIdx >= 0) {
        const suffix = s.slice(staticIdx);
        if (API_BASE) return `${API_BASE}${suffix}`;
        return suffix;
    }
    if (API_BASE && s.startsWith('/static/')) return `${API_BASE}${s}`;
    return s;
}

async function authFetch(url, options = {}) {
    const headers = authHeaders(options.headers || {});
    const res = await fetch(apiUrl(url), { ...options, headers });
    if (res.status === 401) {
        logout();
        throw new Error('登录失效，请重新登录');
    }
    return res;
}

function showMain(show) {
    document.getElementById('main').style.display = show ? 'block' : 'none';
    document.getElementById('loginModal').style.display = show ? 'none' : 'block';
}

function openModal(id) { document.getElementById(id).style.display = 'block'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function startBusy(message = '处理中，请稍候...') {
    busyCount += 1;
    const layer = document.getElementById('globalLoading');
    const text = document.getElementById('globalLoadingText');
    if (text) text.textContent = message;
    if (layer) layer.style.display = 'flex';
}

function stopBusy() {
    busyCount = Math.max(0, busyCount - 1);
    if (busyCount > 0) return;
    const layer = document.getElementById('globalLoading');
    if (layer) layer.style.display = 'none';
}

async function withBusy(message, runner) {
    startBusy(message);
    try {
        return await runner();
    } finally {
        stopBusy();
    }
}

function logout() {
    authToken = '';
    currentUser = '';
    currentRole = '';
    localStorage.removeItem('authToken');
    localStorage.removeItem('flaskToken');
    showMain(false);
    document.getElementById('loginErr').textContent = '';
}

async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    if (!username || !password) {
        document.getElementById('loginErr').textContent = '请输入用户名和密码';
        return;
    }

    const res = await fetch(apiUrl('/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
        document.getElementById('loginErr').textContent = data.error || '登录失败';
        return;
    }

    authToken = data.token;
    currentUser = data.username;
    currentRole = data.role;
    localStorage.setItem('authToken', authToken);
    localStorage.setItem('flaskToken', authToken);
    localStorage.setItem('authUsername', currentUser);
    localStorage.setItem('authRole', currentRole);
    document.getElementById('whoami').textContent = `当前用户: ${currentUser} (${currentRole})`;
    showMain(true);
    reloadData();
}

async function checkLogin() {
    if (!authToken) {
        showMain(false);
        return;
    }
    try {
        const res = await authFetch('/admin/whoami');
        const data = await res.json();
        currentUser = data.username || '';
        currentRole = localStorage.getItem('authRole') || '';
        document.getElementById('whoami').textContent = `当前用户: ${currentUser}${currentRole ? ' (' + currentRole + ')' : ''}`;
        showMain(true);
        reloadData();
    } catch (_) {
        showMain(false);
    }
}

function selectedMode() {
    return document.getElementById('mode').value;
}

function applySearch(items, keys) {
    const kw = document.getElementById('search').value.trim().toLowerCase();
    if (!kw) return items;
    return items.filter(item => keys.some(key => String(item[key] || '').toLowerCase().includes(kw)));
}

function toggleActionButtons(mode) {
    document.getElementById('batchDeleteBtn').style.display = mode === 'data' ? 'inline-block' : 'none';
    document.getElementById('approveBtn').style.display = mode === 'review' ? 'inline-block' : 'none';
    document.getElementById('rejectBtn').style.display = mode === 'review' ? 'inline-block' : 'none';
}

async function reloadData() {
    const mode = selectedMode();
    toggleActionButtons(mode);
    if (mode === 'data') return loadDataDocs();
    if (mode === 'review') return loadReview();
    return loadRejected();
}

function docCardBase(doc, mode = 'data') {
    const summary = doc.summary || {};
    const files = doc.file_urls || [];
    const fileHtml = files.map(url => {
        const href = resolveAssetUrl(url);
        const name = decodeURIComponent((url || '').split('/').pop() || url);
        return `<a class="file-link" href="${href}" target="_blank">${name}</a>`;
    }).join('');

    const chunksHtml = (doc.chunks || []).map(chunk => {
        const urls = (chunk.file_url || []).map(url => {
            const href = resolveAssetUrl(url);
            const name = decodeURIComponent((url || '').split('/').pop() || url);
            return `<a class="file-link" href="${href}" target="_blank">${name}</a>`;
        }).join('');
        return `
            <div class="chunk">
                <div class="chunk-head">
                    <span>chunk #${chunk.chunk_id ?? 'N/A'} · ${chunk.field_type || 'unknown'}</span>
                    <span>ID ${chunk.id || 'N/A'}</span>
                </div>
                <div class="chunk-text">${escapeHtml(chunk.field_text || '')}</div>
                ${urls ? `<div class="files">${urls}</div>` : ''}
            </div>
        `;
    }).join('');

    const check = mode === 'data' ? `<input type="checkbox" class="doc-check" value="${doc.record_id}" />` : `<input type="checkbox" class="review-check" value="${doc.id}" />`;
    const edit = `<button class="btn" onclick="openEdit('${mode}', '${mode === 'review' ? doc.id : doc.record_id}')">编辑</button>`;
    const del = mode === 'data'
        ? `<button class="btn danger" onclick="deleteDoc('${doc.record_id}')">删除</button>`
        : '';
    const docIdentity = doc.doc_id || (mode === 'review' ? doc.id : 'UNKNOWN_DOC');

    return `
        <article class="doc-card">
            <div class="doc-top">
                ${check}
                <div>
                    <div class="doc-title">DocID: ${escapeHtml(docIdentity)}</div>
                    <div class="doc-meta">分片数 ${doc.chunk_count || 0}${mode === 'review' ? ` · 上传人 ${escapeHtml(doc.uploader || '')}` : ''}</div>
                </div>
                <div class="doc-actions">
                    <button class="btn" onclick="toggleChunks(this)">展开 chunks</button>
                    ${edit}
                    ${del}
                </div>
            </div>
            <div class="summary">
                <div class="summary-item"><span class="summary-label">类型:</span>${escapeHtml(summary.type || '')}</div>
                <div class="summary-item"><span class="summary-label">功能:</span>${escapeHtml(summary.object || '')}</div>
                <div class="summary-item"><span class="summary-label">场景:</span>${escapeHtml(summary.purpose || '')}</div>
                <div class="summary-item"><span class="summary-label">客户:</span>${escapeHtml(summary.customer_type || '')}</div>
                <div class="summary-item"><span class="summary-label">关键词:</span>${escapeHtml(summary.keyword || '')}</div>
                ${(summary.problem || []).length ? `<div class="summary-item"><span class="summary-label">问题:</span>${escapeHtml(summary.problem.join('；'))}</div>` : ''}
                ${summary.reply_logic ? `<div class="summary-item"><span class="summary-label">回复逻辑:</span>${escapeHtml(summary.reply_logic)}</div>` : ''}
                ${summary.feature_explanation ? `<div class="summary-item"><span class="summary-label">说明:</span>${escapeHtml(summary.feature_explanation)}</div>` : ''}
                ${fileHtml ? `<div class="files">${fileHtml}</div>` : ''}
            </div>
            <div class="chunk-list">${chunksHtml || '<div class="hint">无 chunk 详情</div>'}</div>
        </article>
    `;
}

function toggleChunks(btn) {
    const list = btn.closest('.doc-card').querySelector('.chunk-list');
    const open = list.style.display === 'grid';
    list.style.display = open ? 'none' : 'grid';
    btn.textContent = open ? '展开 chunks' : '收起 chunks';
}

async function loadDataDocs() {
    const coll = document.getElementById('collection').value;
    const res = await authFetch(`/admin/get_data_paginated?collection=${encodeURIComponent(coll)}&page=1&page_size=13683`);
    const data = await res.json();
    dataDocs = data.grouped_data || [];

    const filtered = applySearch(
        dataDocs.map(d => ({ ...d, __search: `${d.doc_id} ${(d.summary?.problem || []).join(' ')} ${d.summary?.reply_logic || ''} ${d.summary?.feature_explanation || ''}` })),
        ['__search']
    );

    document.getElementById('panelTitle').textContent = '数据管理（按 DocID 聚合）';
    document.getElementById('panelStat').textContent = `共 ${dataDocs.length} 个文档，当前 ${filtered.length}`;

    const list = document.getElementById('list');
    list.innerHTML = filtered.length
        ? filtered.map(doc => docCardBase(doc, 'data')).join('')
        : `<div class="empty">暂无数据</div>`;
}

async function loadReview() {
    const res = await authFetch('/admin/get_review_data');
    const rows = await res.json();
    reviewRows = rows;

    const docs = rows.map(row => ({
        id: row.id,
        doc_id: row.id,
        uploader: row.uploader,
        chunk_count: 1,
        selected_dbs: row.selected_dbs || [],
        summary: {
            type: row.data?.type || '',
            object: row.data?.object || '',
            purpose: row.data?.purpose || '',
            customer_type: row.data?.customer_type || '',
            keyword: row.data?.keyword || '',
            problem: row.data?.problem || [],
            reply_logic: row.data?.reply_logic || row.data?.text || '',
            feature_explanation: row.data?.feature_explanation || '',
            example: row.data?.example || '',
            notes: row.data?.notes || ''
        },
        file_urls: [...(row.data?.image_url || []), ...(row.data?.file_url || [])].filter(Boolean),
        chunks: [{ id: row.id, chunk_id: 1, field_type: 'review_record', field_text: row.data?.reply_logic || '' }]
    }));

    const filtered = applySearch(
        docs.map(d => ({ ...d, __search: `${d.uploader} ${d.summary.object} ${d.summary.reply_logic}` })),
        ['__search']
    );

    document.getElementById('panelTitle').textContent = '审核队列';
    document.getElementById('panelStat').textContent = `待审核 ${docs.length} 条，当前 ${filtered.length}`;
    const list = document.getElementById('list');
    list.innerHTML = filtered.length
        ? filtered.map(doc => docCardBase(doc, 'review')).join('')
        : `<div class="empty">暂无待审核记录</div>`;
}

async function loadRejected() {
    const res = await authFetch('/admin/get_all_rejected');
    const data = await res.json();
    rejectedRows = [];

    Object.entries(data.rejected || {}).forEach(([uploader, records]) => {
        (records || []).forEach(rec => {
            rejectedRows.push({ uploader, ...rec });
        });
    });

    const filtered = applySearch(
        rejectedRows.map(r => ({ ...r, __search: `${r.uploader} ${r.data?.object || ''} ${r.reject_reason || ''}` })),
        ['__search']
    );

    document.getElementById('panelTitle').textContent = '被拒记录';
    document.getElementById('panelStat').textContent = `共 ${rejectedRows.length} 条，当前 ${filtered.length}`;

    const list = document.getElementById('list');
    if (!filtered.length) {
        list.innerHTML = `<div class="empty">暂无被拒记录</div>`;
        return;
    }

    list.innerHTML = filtered.map((r, idx) => {
        const data = r.data || {};
        const links = [...(data.image_url || []), ...(data.file_url || [])]
            .filter(u => u && u !== 'N/A')
            .map(u => `<a class="file-link" href="${resolveAssetUrl(u)}" target="_blank">${decodeURIComponent(u.split('/').pop() || u)}</a>`)
            .join('');
        return `
            <article class="doc-card">
                <div class="doc-top">
                    <div class="chip">#${idx + 1}</div>
                    <div>
                        <div class="doc-title">${escapeHtml(r.uploader)} · ${escapeHtml(r.id || '')}</div>
                        <div class="doc-meta">拒绝原因: ${escapeHtml(r.reject_reason || '未填写')}</div>
                    </div>
                    <div class="doc-actions">
                        <button class="btn danger" onclick="deleteRejected('${escapeAttr(r.uploader)}','${escapeAttr(r.id)}')">删除</button>
                    </div>
                </div>
                <div class="summary">
                    <div class="summary-item"><span class="summary-label">功能:</span>${escapeHtml(data.object || '')}</div>
                    <div class="summary-item"><span class="summary-label">类型:</span>${escapeHtml(data.type || '')}</div>
                    <div class="summary-item"><span class="summary-label">问题:</span>${escapeHtml((data.problem || []).join('；'))}</div>
                    ${links ? `<div class="files">${links}</div>` : ''}
                </div>
            </article>
        `;
    }).join('');
}

async function deleteDoc(recordId) {
    if (!recordId) return;
    if (!confirm('确认删除该文档下所有分片？')) return;
    await withBusy('正在删除文档，请稍候...', async () => {
        const coll = document.getElementById('collection').value;
        const res = await authFetch(`/admin/delete_record?collection=${encodeURIComponent(coll)}&id=${recordId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || '删除失败');
        await reloadData();
    });
}

async function batchDeleteDocs() {
    const checks = Array.from(document.querySelectorAll('.doc-check:checked')).map(c => c.value).filter(Boolean);
    if (!checks.length) return alert('请先勾选要删除的文档');
    if (!confirm(`确认批量删除 ${checks.length} 个文档？`)) return;
    await withBusy('正在批量删除，请稍候...', async () => {
        const coll = document.getElementById('collection').value;
        const res = await authFetch(`/admin/delete_records?collection=${encodeURIComponent(coll)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: checks })
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || '批量删除失败');
        alert(data.message || '删除成功');
        await reloadData();
    });
}

async function batchApprove() {
    const ids = Array.from(document.querySelectorAll('.review-check:checked')).map(c => c.value);
    if (!ids.length) return alert('请勾选要通过的审核记录');
    await withBusy('正在通过审核，请稍候...', async () => {
        const records = reviewRows.filter(r => ids.includes(String(r.id)));
        const res = await authFetch('/admin/approve_records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids, records })
        });
        const data = await res.json();
        if (!res.ok || data.success === false) return alert(data.error || '审核通过失败');
        alert(data.message || '已通过');
        await reloadData();
    });
}

async function batchReject() {
    const ids = Array.from(document.querySelectorAll('.review-check:checked')).map(c => c.value);
    if (!ids.length) return alert('请勾选要拒绝的审核记录');
    const reason = prompt('请输入拒绝原因');
    if (reason === null) return;
    if (!reason.trim()) return alert('拒绝原因不能为空');

    await withBusy('正在拒绝并归档，请稍候...', async () => {
        const records = reviewRows.filter(r => ids.includes(String(r.id)));
        const res = await authFetch('/admin/reject_records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids, records, reject_reason: reason.trim() })
        });
        const data = await res.json();
        if (!res.ok || data.success === false) return alert(data.error || '拒绝失败');
        alert('已拒绝并归档');
        await reloadData();
    });
}

async function deleteRejected(uploader, id) {
    if (!confirm('确认删除该被拒记录？')) return;
    await withBusy('正在删除被拒记录，请稍候...', async () => {
        const res = await authFetch('/admin/delete_rejected', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uploader, id })
        });
        const data = await res.json();
        if (!res.ok || !data.success) return alert(data.error || '删除失败');
        await reloadData();
    });
}

function findDataDoc(recordId) {
    return dataDocs.find(d => String(d.record_id) === String(recordId));
}

function findReviewRow(recordId) {
    return reviewRows.find(r => String(r.id) === String(recordId));
}

function setEditFiles(urls) {
    const html = (urls || []).filter(u => u && u !== 'N/A').map(u => {
        const n = decodeURIComponent((u || '').split('/').pop() || u);
        return `<label style="display:block; margin-bottom:5px;"><input type="checkbox" checked data-url="${escapeAttr(u)}" /> ${escapeHtml(n)}</label>`;
    }).join('');
    document.getElementById('keepFiles').innerHTML = html || '<span class="hint">无可保留附件</span>';
}

function openEdit(mode, recordId) {
    document.getElementById('editMode').value = mode;
    document.getElementById('editRecordId').value = recordId;

    const dbWrap = document.getElementById('editDbWrap');
    const dbChecks = document.getElementById('editDbChecks');
    dbChecks.innerHTML = DB_OPTIONS.map(db => `<label><input type="checkbox" value="${db.v}" /> ${db.t}</label>`).join('');

    let summary = {};
    let urls = [];

    if (mode === 'data') {
        const doc = findDataDoc(recordId);
        summary = doc?.summary || {};
        urls = doc?.file_urls || [];
        dbWrap.style.display = 'none';
        document.getElementById('editTitle').textContent = `编辑文档 ${doc?.doc_id || ''}`;
    } else {
        const row = findReviewRow(recordId);
        summary = row?.data || {};
        urls = [...(row?.data?.image_url || []), ...(row?.data?.file_url || [])];
        dbWrap.style.display = 'block';
        (row?.selected_dbs || []).forEach(v => {
            const cb = dbChecks.querySelector(`input[value="${v}"]`);
            if (cb) cb.checked = true;
        });
        document.getElementById('editTitle').textContent = `编辑审核记录 ${row?.id || ''}`;
    }

    document.getElementById('editType').value = summary.type || '';
    document.getElementById('editObject').value = summary.object || '';
    document.getElementById('editPurpose').value = summary.purpose || '';
    document.getElementById('editCustomerType').value = summary.customer_type || '';
    document.getElementById('editKeyword').value = summary.keyword || '';
    document.getElementById('editProblem').value = (summary.problem || []).join('\n');
    document.getElementById('editReplyLogic').value = summary.reply_logic || summary.text || '';
    document.getElementById('editFeature').value = summary.feature_explanation || '';
    document.getElementById('editExample').value = summary.example || '';
    document.getElementById('editNotes').value = summary.notes || '';
    document.getElementById('editImages').value = '';
    document.getElementById('editDocs').value = '';
    setEditFiles(urls);

    openModal('editModal');
}

async function uploadEditFiles() {
    const keepUrls = Array.from(document.querySelectorAll('#keepFiles input[type="checkbox"]:checked')).map(cb => cb.dataset.url);
    const keepImage = keepUrls.filter(u => /\.(png|jpg|jpeg|gif|bmp|webp|svg)$/i.test(u));
    const keepDoc = keepUrls.filter(u => !/\.(png|jpg|jpeg|gif|bmp|webp|svg)$/i.test(u));

    const newImageUrls = [];
    for (const file of Array.from(document.getElementById('editImages').files || [])) {
        const form = new FormData();
        form.append('image', file);
        const res = await authFetch('/upload_image', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || `图片上传失败: ${file.name}`);
        newImageUrls.push(data.url);
    }

    const newDocUrls = [];
    for (const file of Array.from(document.getElementById('editDocs').files || [])) {
        const form = new FormData();
        form.append('document', file);
        const res = await authFetch('/upload_document', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || `文档上传失败: ${file.name}`);
        newDocUrls.push(data.url);
    }

    return {
        image_url: [...keepImage, ...newImageUrls],
        file_url: [...keepDoc, ...newDocUrls]
    };
}

async function saveEdit() {
    const mode = document.getElementById('editMode').value;
    const recordId = document.getElementById('editRecordId').value;
    if (!recordId) return;

    try {
        await withBusy('正在保存修改，请稍候...', async () => {
            const files = await uploadEditFiles();
            const payload = {
                id: recordId,
                object: document.getElementById('editObject').value.trim(),
                type: document.getElementById('editType').value.trim(),
                purpose: document.getElementById('editPurpose').value.trim(),
                customer_type: document.getElementById('editCustomerType').value.trim(),
                keyword: document.getElementById('editKeyword').value.trim(),
                problem: document.getElementById('editProblem').value.split('\n').map(v => v.trim()).filter(Boolean),
                reply_logic: document.getElementById('editReplyLogic').value.trim(),
                feature_explanation: document.getElementById('editFeature').value.trim(),
                example: document.getElementById('editExample').value.trim(),
                notes: document.getElementById('editNotes').value.trim(),
                image_url: files.image_url.length ? files.image_url : ['N/A'],
                file_url: files.file_url.length ? files.file_url : ['N/A']
            };

            let res;
            if (mode === 'data') {
                const coll = document.getElementById('collection').value;
                res = await authFetch(`/admin/update_record?collection=${encodeURIComponent(coll)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                const selected_dbs = Array.from(document.querySelectorAll('#editDbChecks input:checked')).map(cb => cb.value);
                if (!selected_dbs.length) return alert('审核模式下请至少选择一个目标数据库');
                res = await authFetch('/admin/update_review_record', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: recordId, selected_dbs, data: payload })
                });
            }

            const data = await res.json();
            if (!res.ok || data.success === false) return alert(data.error || '保存失败');
            closeModal('editModal');
            await reloadData();
        });
    } catch (err) {
        alert(err.message || '保存失败');
    }
}

async function showLogs() {
    const res = await authFetch('/admin/get_logs');
    const logs = await res.json();
    const body = document.getElementById('logBody');
    body.innerHTML = (logs || []).slice().reverse().map(log => `
        <div class="doc-card">
            <div class="summary">
                <div class="summary-item"><span class="summary-label">时间:</span>${escapeHtml(log.timestamp || '')}</div>
                <div class="summary-item"><span class="summary-label">用户:</span>${escapeHtml(log.user || '')}</div>
                <div class="summary-item"><span class="summary-label">操作:</span>${escapeHtml(log.type || '')}</div>
                <div class="summary-item"><span class="summary-label">集合:</span>${escapeHtml(log.collection || '')}</div>
                <div class="summary-item"><span class="summary-label">详情:</span>${escapeHtml(log.details || '')}</div>
            </div>
        </div>
    `).join('') || '<div class="empty">暂无日志</div>';
    openModal('logModal');
}

function escapeHtml(text) {
    return String(text || '').replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
}

function escapeAttr(text) {
    return String(text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.getElementById('mode').addEventListener('change', reloadData);
document.getElementById('collection').addEventListener('change', () => { if (selectedMode() === 'data') reloadData(); });
document.getElementById('search').addEventListener('input', reloadData);
window.addEventListener('click', e => { if (e.target.classList.contains('modal')) e.target.style.display = 'none'; });

checkLogin();
